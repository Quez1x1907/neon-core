/* ==================== Сущности: пулы объектов (без GC-мусора в цикле) ==================== */

/* ---- Пул врагов ---- */
const EP = [];
const EP_MAX = 220;
let UID = 0;
function initPools(){
  EP.length = 0;
  for (let i=0;i<EP_MAX;i++) EP.push({ alive:false, id:0, type:'', def:null, pathIdx:0, pts:null, len:0,
    dist:0, x:0, y:0, ang:0, hp:1, maxhp:1, armor:0, speed:1, baseSpeed:1, slowF:0, slowT:0,
    shield:0, maxshield:0, shieldT:99, phased:false, phaseT:0, healT:0, healAmt:0, hitF:0,
    mut:null, variant:null, reward:0, boss:false, dead:false });
  BP.length = 0;
  for (let i=0;i<120;i++) BP.push({ alive:false });
  PP.length = 0;
  for (let i=0;i<700;i++) PP.push({ alive:false });
  FP.length = 0;
  for (let i=0;i<80;i++) FP.push({ alive:false });
  TX.length = 0;
  for (let i=0;i<70;i++) TX.push({ alive:false });
}
function epGet(){
  for (let i=0;i<EP_MAX;i++){ const e = EP[epIdx]; epIdx = (epIdx+1)%EP_MAX; if (!e.alive) return e; }
  return null;
}
let epIdx = 0;

/* ---- Спавн врага. mut — ключ мутации или null ---- */
function spawnEnemy(type, wave, mult, pathIdx, mut, atDist, variant){
  const def = ENEMIES[type];
  const e = epGet();
  if (!e) return null; // пул переполнен — пропускаем (не должно происходить)
  const hpMul = hpMulFor(wave, mult);
  e.alive = true; e.dead = false; e.id = ++UID;
  e.type = type; e.def = def; e.boss = !!def.boss;
  e.variant = (variant === null || variant === undefined) ? null : variant;
  e.pathIdx = pathIdx; e.pts = G.paths[pathIdx]; e.len = e.pts.length-1;
  e.maxhp = def.hp*hpMul*(mut && MUT[mut].hp ? MUT[mut].hp : 1)*(variant && BOSSES[variant].hpM ? BOSSES[variant].hpM : 1);
  e.hp = e.maxhp;
  e.armor = (variant && BOSSES[variant].armor !== undefined ? BOSSES[variant].armor : (def.armor||0))
          + (mut==='hard' ? MUT.hard.armor : 0)
          + (G.curWave && G.curWave.mod === 'armor' ? WAVE_MODS.armor.armor : 0);
  e.baseSpeed = def.speed*(mut==='swift' ? MUT.swift.spd : 1)*(variant && BOSSES[variant].spdM ? BOSSES[variant].spdM : 1)
          * (G.curWave && G.curWave.mod === 'storm' ? WAVE_MODS.storm.spd : 1);
  e.speed = e.baseSpeed;
  e.stunT = 0;
  e.mut = mut||null;
  e.dist = atDist||0;
  e.slowF = 0; e.slowT = 0;
  e.maxshield = def.shield ? def.shield*Math.sqrt(hpMul) : 0; // щит растёт медленнее HP — иначе поздние волны «запираются»
  e.shield = e.maxshield; e.shieldT = 99;
  e.phased = false; e.phaseT = def.phase ? rnd(1, def.phase.every*0.6) : 0;
  e.healT = def.heal ? def.heal.per*0.5 : 0;
  e.healAmt = def.heal ? def.heal.amt*Math.sqrt(hpMul) : 0;
  e.poisonS = 0; e.poisonT = 0; e.poisonDps = 0; e.poisonAcid = false;
  e.hitF = 0;
  e.reward = def.reward*(1+(wave-1)*0.02);
  const p = posAt(e.pts, e.dist);
  e.x = p.x; e.y = p.y; e.ang = p.ang;
  if (e.boss){ UI.bossShow(e); }
  return e;
}

/* Позиция вдоль пути (pts — массив клеток [c,r]) */
function posAt(pts, d){
  const i = clamp(Math.floor(d), 0, pts.length-2);
  const f = clamp(d - i, 0, 1);
  const a = pts[i], b = pts[i+1];
  return { x: lerp(a[0], b[0], f)+0.5, y: lerp(a[1], b[1], f)+0.5, ang: Math.atan2(b[1]-a[1], b[0]-a[0]) };
}

/* ---- Пул пуль (ракеты) ---- */
const BP = [];
function bpGet(){ for (let i=0;i<BP.length;i++){ if (!BP[i].alive) return BP[i]; } return null; }

/* ---- Пул частиц ---- */
const PP = [];
function ppGet(){ for (let i=0;i<PP.length;i++){ if (!PP[i].alive) return PP[i]; } return null; }
/* Вспышка частиц (в px-координатах) */
function burst(px, py, color, n, spd, life){
  if (S.lowgfx) n = Math.ceil(n/2); // слабый режим — вдвое меньше частиц
  const free = PP.reduce((a,p)=>a+(p.alive?0:1), 0); // защита от переполнения: режем количество
  n = Math.min(n, Math.floor(free*0.4), 40);
  for (let i=0;i<n;i++){
    const p = ppGet(); if (!p) return;
    const a = rnd(TAU), v = rnd(spd*0.3, spd);
    p.alive = true; p.x = px; p.y = py;
    p.vx = Math.cos(a)*v; p.vy = Math.sin(a)*v;
    p.t = 0; p.ttl = rnd(life*0.5, life); p.color = color; p.size = rnd(1.5, 3.5);
    p.kind = 'spark';
  }
}
function ring(px, py, color, r0, r1, ttl, width){
  const p = ppGet(); if (!p) return;
  p.alive = true; p.x = px; p.y = py; p.vx = 0; p.vy = 0;
  p.t = 0; p.ttl = ttl; p.color = color; p.size = r0; p.r1 = r1; p.width = width||2; p.kind = 'ring';
}

/* ---- Всплывающий текст ---- */
const FP = [];
function floater(px, py, txt, color, big){
  for (let i=0;i<FP.length;i++){
    const f = FP[i];
    if (!f.alive){
      f.alive = true; f.x = px; f.y = py; f.txt = txt; f.color = color;
      f.t = 0; f.ttl = big ? 1.6 : 1.1; f.big = !!big;
      return;
    }
  }
}

/* ---- Трассы выстрелов и молнии ---- */
const TX = [];
function tracer(x1,y1,x2,y2,color,ttl,width){
  for (let i=0;i<TX.length;i++){
    const tr = TX[i];
    if (!tr.alive || tr.kind==='tracer'){
      tr.alive = true; tr.kind = 'tracer';
      tr.x1=x1; tr.y1=y1; tr.x2=x2; tr.y2=y2; tr.color=color; tr.t=0; tr.ttl=ttl||0.12; tr.width=width||2;
      return;
    }
  }
}
function zapFx(pts, color){
  for (let i=0;i<TX.length;i++){
    const tr = TX[i];
    if (!tr.alive || tr.kind==='zap'){
      tr.alive = true; tr.kind = 'zap'; tr.pts = pts; tr.color = color; tr.t = 0; tr.ttl = 0.18; tr.width = 2;
      return;
    }
  }
}

/* ==================== Боевая математика ==================== */
/* Множитель HP волны: карта × экспонента волны.
   Прогрев: на дорогих картах (большая mult) сложность разгоняется к 10-й волне,
   иначе первые волны непомерно жёсткие. */
function hpMulFor(wave, mult){
  const warm = 0.55 + 0.45*Math.min(wave,10)/10;
  return (1 + (mult-1)*warm) * Math.pow(1.115, wave-1) * (1 + 0.03*wave);
}
/* Награда с учётом карты и мета-прокачки. Глобальный множитель 0.7 — экономика строже */
function rewardMulFor(wave, mult){
  return 0.7 * (1 + (wave-1)*0.02) * (0.6 + 0.4*mult) * metaVals().rewardMul;
}

/* Нанесение урона: armor гасит, pierce пробивает, щит впитывает. src — тип источника для статистики */
function damage(e, amount, pierce, silent, src){
  if (!e.alive || e.dead) return;
  if (e.phased) return; // фантом вне фазы неуязвим
  let armor = Math.max(0, e.armor - (pierce||0));
  if (e.poisonAcid) armor = Math.max(0, armor - 3); // кислота Токсина разъедает броню
  let dmg = Math.max(1, amount - armor);
  if (e.shield > 0){
    const s = Math.min(e.shield, dmg);
    e.shield -= s; dmg -= s; e.shieldT = 0;
  }
  if (dmg > 0){
    e.hp -= dmg; e.hitF = 0.12;
    if (src && G.dmgByType) G.dmgByType[src] = (G.dmgByType[src]||0) + dmg;
  }
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  if (e.dead) return;
  e.dead = true; e.alive = false;
  const px = V.ox + e.x*V.cs, py = V.oy + e.y*V.cs;
  const color = e.mut ? MUT[e.mut].color : e.def.color;
  burst(px, py, color, e.boss ? 42 : 10, e.boss ? 260 : 150, 0.5);
  ring(px, py, color, 4, e.boss ? 90 : e.def.r*V.cs*2.2, e.boss ? 0.6 : 0.3, e.boss ? 3 : 2);
  const goldMul = (G.curWave && G.curWave.mod === 'gold') ? WAVE_MODS.gold.reward : 1;
  const money = Math.round(e.reward * rewardMulFor(G.wave, G.map.mult) * goldMul);
  G.cash += money; S.stats.money += money;
  S.stats.kills++;
  // заряд ядра: убийства копят нову
  G.coreCharge = Math.min(100, (G.coreCharge||0) + (e.boss ? 40 : 5));
  AudioSys.play(e.boss ? 'boom' : 'hit');
  if (e.boss){
    S.stats.bosses++;
    G.shake(14); G.slowmoT = 0.9;
    floater(px, py, '+$'+money, '#a8ff3e', true);
    UI.bossHide();
    // Гидра распадается на дронов (значения читаем до переиспользования слота пула)
    if (e.variant === 'hydra' && BOSSES.hydra.split){
      const d0 = e.dist, pIdx = e.pathIdx, wv = G.wave, ml = G.map.mult;
      for (let i=0;i<BOSSES.hydra.split;i++)
        spawnEnemy('drone', wv, ml, pIdx, null, Math.max(0, d0 - i*0.4));
    }
  }
  // Делитель распадается на биты
  if (e.def.split){
    const d0 = e.dist, pIdx = e.pathIdx, wv = G.wave, ml = G.map.mult;
    for (let i=0;i<e.def.split;i++)
      spawnEnemy('bit', wv, ml, pIdx, null, Math.max(0, d0 - i*0.35));
  }
  // Мутация ЭМИ: выводит башни из строя
  if (e.mut === 'emp'){
    AudioSys.play('emp');
    ring(px, py, MUT.emp.color, 6, 2.1*V.cs, 0.5, 3);
    for (const tw of G.towers){
      if (dist2(tw.x, tw.y, e.x, e.y) < 2.1*2.1){ tw.stun = 2.5; }
    }
  }
  checkAch();
}

/* Вирус дошёл до ядра */
function leakEnemy(e){
  e.dead = true; e.alive = false;
  const def = e.def;
  G.lives -= def.leak;
  G.leaksThisWave += def.leak;
  G.cleanStreak = 0;
  G.coreFlash = 1;
  G.shake(6 + def.leak*2);
  AudioSys.play('leak');
  const px = V.ox + e.x*V.cs, py = V.oy + e.y*V.cs;
  burst(px, py, '#ff3355', 14, 180, 0.4);
  floater(px, py, '-'+def.leak, '#ff3355', e.boss);
  UI.bossHide();
  if (G.lives <= 0){ G.lives = 0; defeat(); }
  checkAch();
}
/* ==================== Генератор волн ====================
   Волна = список групп {type, count, gap, delay, mut}. Паттерны разнообразят составы,
   бюджет растёт по волне; типы вводятся постепенно (TYPE_THRESH / TECH_FLOOR по карте). */

function typeAvail(type, wave, tech){
  return wave >= TYPE_THRESH[type] || tech >= TECH_FLOOR[type];
}

function availTypes(wave, tech){
  const list = [];
  for (const k in ENEMIES){ if (!ENEMIES[k].boss && typeAvail(k, wave, tech)) list.push(k); }
  return list;
}

/* Случайная мутация группы (только поздние волны) */
function rollMut(wave, tech){
  const late = (wave >= 24) || (tech >= 5 && wave >= 12);
  if (!late || Math.random() > 0.42) return null;
  const r = Math.random();
  return r < 0.4 ? 'swift' : (r < 0.75 ? 'hard' : 'emp');
}

/* Выбор очередного паттерна; avoid — не повторять предыдущий тип */
function pickGroup(wave, avail, avoid){
  const options = [];
  for (const tp of avail){
    const d = ENEMIES[tp];
    let w = 1;
    if (tp === 'drone') w = 3;
    if (tp === 'sprinter') w = 2;
    if (tp === 'bit') w = wave >= 6 ? 1.6 : 0;
    if (tp === 'tank') w = 1.4;
    if (tp === 'mender') w = 0.9;   // сопровождение, волнует состав
    if (tp === 'phantom') w = 1;
    if (tp === 'aegis') w = 1;
    if (tp !== avoid) options.push({ tp, w, cost: d.cost });
  }
  if (!options.length) options.push({ tp:'drone', w:1, cost:ENEMIES.drone.cost });
  // взвешенный выбор
  let sum = 0; for (const o of options) sum += o.w;
  let r = Math.random()*sum, chosen = options[0];
  for (const o of options){ r -= o.w; if (r <= 0){ chosen = o; break; } }
  const tp = chosen.tp;
  let count, gap;
  switch(tp){
    case 'bit':      count = clamp(8 + Math.floor(wave*0.7), 8, 18); gap = 0.22; break;
    case 'sprinter': count = 4 + rndi(0, 3) + Math.floor(wave*0.15); gap = 0.38; break;
    case 'tank':     count = 1 + Math.floor(wave/9); gap = 1.7; break;
    case 'mender':   count = 1 + (wave >= 17 ? 1 : 0); gap = 2.2; break;
    case 'phantom':  count = 2 + (wave >= 19 ? 1 : 0); gap = 1.15; break;
    case 'aegis':    count = 1 + (wave >= 19 ? 1 : 0); gap = 2.1; break;
    default:         count = 5 + Math.floor(wave*0.55); gap = Math.max(0.34, 0.85 - wave*0.012);
  }
  return { type:tp, count, gap };
}

/* Модификатор волны: в кампании по расписанию, в бесконечном — случайно */
function waveMod(wave, endless){
  if (!endless){
    return CAMPAIGN_MODS[wave] || null;
  }
  if (wave >= 6 && wave % 5 !== 0 && Math.random() < 0.22) return pick(['gold','storm','armor']);
  return null;
}

/* Собрать волну. Возвращает {groups, bossWave, mod} */
function buildWave(mapIdx, wave, endless){
  const map = MAPS[mapIdx];
  const tech = mapIdx;
  const groups = [];
  const mod = waveMod(wave, endless);
  const isBossWave = endless ? (wave % 5 === 0) : (wave === WAVES_PER_MAP);

  if (isBossWave){
    groups.push({ type:'boss', count:1, gap:0, delay:0.8, mut:null, variant:['titan','hydra','surge'][mapIdx % 3] });
    // лёгкий эскорт
    if (endless || wave >= 12){
      const esc = availTypes(wave, tech).filter(k=>k!=='mender');
      const tp = esc.length ? pick(esc) : 'drone';
      groups.push({ type:tp, count:4 + Math.floor(wave*0.2), gap:0.7, delay:3, mut:rollMut(wave, tech) });
    }
    return { groups, bossWave:true, mod:null };
  }

  let budget = (7 + wave*3.3 + wave*wave*0.10) * (0.9 + 0.1*map.mult);
  if (mod === 'gold') budget *= 1.3; // золотая волна плотнее — но и награда ×2.5
  let delay = 0.4, avoid = null, mutUsed = false;
  let guard = 0;
  while (budget > 0.9 && guard++ < 12){
    const g = pickGroup(wave, availTypes(wave, tech), avoid);
    let cost = g.count * ENEMIES[g.type].cost;
    // подгоняем количество под остаток бюджета
    if (cost > budget + 2){
      g.count = Math.max(1, Math.floor(budget / ENEMIES[g.type].cost));
      cost = g.count * ENEMIES[g.type].cost;
      if (cost < 0.8) continue;
    }
    avoid = g.type;
    g.delay = delay;
    // не более одной мутировавшей группы за волну — иначе поздние волны идут лавиной
    g.mut = mutUsed ? null : rollMut(wave, tech);
    if (g.mut) mutUsed = true;
    groups.push(g);
    budget -= cost;
    delay += g.count*g.gap + 1.1;
  }
  return { groups, bossWave:false, mod };
}

/* Сводка для превью следующей волны: [{type, count, mut}] */
function wavePreview(w){
  const map = new Map();
  for (const g of w.groups){
    const k = g.type + '|' + (g.mut||'');
    const cur = map.get(k) || { type:g.type, count:0, mut:g.mut };
    cur.count += g.count;
    map.set(k, cur);
  }
  return [...map.values()];
}

/* Итоговое расписание спавна: отсортированные события */
function waveEvents(w, nPaths){
  const ev = [];
  w.groups.forEach((g, gi)=>{
    for (let i=0;i<g.count;i++)
      ev.push({ t: g.delay + i*g.gap, type: g.type, mut: g.mut, variant: g.variant||null, path: nPaths > 1 ? gi % nPaths : 0 });
  });
  ev.sort((a,b)=>a.t-b.t);
  return ev;
}
/* ==================== ИГРА: состояние, обновление, рендер ==================== */

const V = { cs:40, ox:0, oy:0, w:0, h:0, dpr:1 };
let boardBG = null;
const boardCv = $('board');
const bctx = boardCv.getContext('2d');

const G = {
  active:false, mapIdx:0, map:null, endless:false,
  paths:[], pathCells:new Set(), deco:new Set(), buildable:new Set(), pathPxs:[], core:null,
  cash:0, lives:0, maxLives:20, wave:0, waveState:'prep', waveT:0, events:[],
  curWave:null, nextWave:null, enemiesCount:0, bossRef:null,
  state:'play', speed:1, slowmoT:0, coreFlash:0, cleanStreak:0, leaksThisWave:0,
  towers:[], towerGrid:new Map(),
  placing:null, selected:null, hoverCell:null,
  shakeT:0, shakeAmp:0, time:0,
  abil:{ emp:{cd:0}, over:{cd:0, active:0} }, // способности: перезарядка и активный эффект
  targeting:null,          // 'emp' — выбор места для импульса
  autoT:0,                 // таймер автостарта волны
  coreCharge:0,            // заряд новы (0..100)
  dmgByType:{},            // накопленный урон по типам башен — для статистики победы
};

/* ---------- Геометрия карты ---------- */
function computePaths(map){
  G.paths = map.paths.map(wps=>{
    const pts = [];
    for (let i=0;i<wps.length-1;i++){
      const c0=wps[i][0], r0=wps[i][1], c1=wps[i+1][0], r1=wps[i+1][1];
      const sc=Math.sign(c1-c0), sr=Math.sign(r1-r0);
      let c=c0, r=r0;
      pts.push([c,r]);
      while (c!==c1 || r!==r1){ c+=sc; r+=sr; pts.push([c,r]); }
    }
    return pts;
  });
  G.pathCells = new Set();
  for (const pts of G.paths)
    for (const [c,r] of pts)
      if (c>=0 && c<COLS && r>=0 && r<ROWS) G.pathCells.add(c+','+r);
  G.deco = new Set(map.deco.map(d=>d[0]+','+d[1]));
  // зоны стройки: свободные клетки вокруг трассы (8 соседей)
  G.buildable = new Set();
  for (const k of G.pathCells){
    const [pc, pr] = k.split(',').map(Number);
    for (let dc=-1; dc<=1; dc++) for (let dr=-1; dr<=1; dr++){
      const c = pc+dc, r = pr+dr;
      if (c<0 || r<0 || c>=COLS || r>=ROWS) continue;
      const bk = c+','+r;
      if (!G.pathCells.has(bk) && !G.deco.has(bk)) G.buildable.add(bk);
    }
  }
  G.core = G.paths[0][G.paths[0].length-1];
}
function computePathPxs(){
  G.pathPxs = G.paths.map(pts => pts.map(([c,r]) => [V.ox+(c+0.5)*V.cs, V.oy+(r+0.5)*V.cs]));
}

/* ---------- Вид/канва: пересчёт при ресайзе ---------- */
function computeView(){
  const wrap = $('boardwrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  V.dpr = S.lowgfx ? 1 : Math.min(window.devicePixelRatio||1, 1.5); // низкая графика = 1x, обычно — до 1.5x
  V.w = w; V.h = h;
  boardCv.width = Math.round(w*V.dpr); boardCv.height = Math.round(h*V.dpr);
  V.cs = Math.min(w/COLS, h/ROWS);
  V.ox = (w - V.cs*COLS)/2;
  const slackY = h - V.cs*ROWS;
  V.oy = slackY > V.cs*2 ? 2 : slackY/2; // портрет: поле прижато к HUD, пустота уходит к кнопке волны
  computePathPxs();
  renderBoardBG();
  renderGame(); // ресайз мог случиться на паузе — кадр должен остаться актуальным
}

/* ---------- Старт/выход партии ---------- */
function startGame(mapIdx, endless){
  G.active = true; G.mapIdx = mapIdx; G.map = MAPS[mapIdx]; G.endless = !!endless;
  computePaths(G.map);
  const mv = metaVals();
  G.cash = mv.cash; G.lives = mv.lives; G.maxLives = mv.lives;
  G.wave = 0; G.waveState = 'prep'; G.events = []; G.enemiesCount = 0;
  G.curWave = null; G.nextWave = buildWave(mapIdx, 1, G.endless);
  G.towers = []; G.towerGrid = new Map();
  G.state = 'play'; G.speed = 1; G.slowmoT = 0; G.coreFlash = 0;
  G.cleanStreak = 0; G.leaksThisWave = 0; G.time = 0;
  G.placing = null; G.selected = null; G.hoverCell = null;
  G.bossRef = null; G.shakeT = 0; G.shakeAmp = 0;
  G.abil = { emp:{cd:0}, over:{cd:0, active:0} };
  G.targeting = null; G.autoT = 0;
  G.coreCharge = 0; G.dmgByType = {};
  initPools();
  UI.bossHide();
  UI.renderInspector();
  UI.showScreen('game');
  computeView();
  UI.buildBuildbar();
  UI.updateHUD(true);
  UI.refreshWaveUI();
  UI.hintLogic();
}

function exitGame(){
  G.active = false; G.placing = null; G.selected = null;
  UI.bossHide();
  UI.showScreen('maps');
  UI.renderMaps();
}

/* ---------- Постройка/улучшение/продажа ---------- */
function canPlace(c,r){
  if (c<0||r<0||c>=COLS||r>=ROWS) return false;
  const k = c+','+r;
  return G.buildable.has(k) && !G.towerGrid.has(k);
}
function towerAt(c,r){ return G.towerGrid.get(c+','+r) || null; }

function placeTower(type, c, r){
  const def = TOWERS[type];
  if (!canPlace(c,r) || G.cash < def.cost){ AudioSys.play('error'); return false; }
  G.cash -= def.cost;
  const tw = { id:++UID, type, lvl:0, c, r, x:c+0.5, y:r+0.5, cd:0, invested:def.cost,
    mode: def.kind==='sniper' ? 'strong' : 'first', aim:-TAU/8, stun:0, exposure:0,
    targetRef:null, prodT:0, tickT:0 };
  G.towers.push(tw); G.towerGrid.set(c+','+r, tw);
  if (type === 'amp') S.stats.maxAmps = Math.max(S.stats.maxAmps, G.towers.filter(t=>t.type==='amp').length);
  S.stats.towersBuilt++;
  S.stats.maxTowers = Math.max(S.stats.maxTowers, G.towers.length);
  AudioSys.play('place');
  haptic('light');
  burst(V.ox+(c+0.5)*V.cs, V.oy+(r+0.5)*V.cs, def.color, 12, 130, 0.4);
  UI.hintDismiss('place');
  checkAch();
  return true;
}
function upgradeTower(tw){
  const def = TOWERS[tw.type];
  if (tw.lvl+1 >= def.lv.length){ AudioSys.play('error'); return; }
  const cost = def.lv[tw.lvl+1].up;
  if (G.cash < cost){ AudioSys.play('error'); return; }
  G.cash -= cost; tw.invested += cost; tw.lvl++;
  S.stats.maxTowerLevel = Math.max(S.stats.maxTowerLevel, tw.lvl+1);
  AudioSys.play('upgrade');
  ring(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, def.color, 4, V.cs*0.9, 0.4, 2);
  burst(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, def.color, 8, 110, 0.35);
  checkAch();
}
/* Выбор специализации 3-го уровня — необратимо */
function chooseBranch(tw, br){
  const def = TOWERS[tw.type];
  if (!def.branches || tw.lvl !== 1 || tw.branch){ AudioSys.play('error'); return; }
  const brDef = def.branches[br];
  if (G.cash < brDef.lv.up){ AudioSys.play('error'); return; }
  G.cash -= brDef.lv.up;
  tw.invested += brDef.lv.up;
  tw.branch = br;
  tw.lvOverride = Object.assign({ up:0 }, brDef.lv);
  tw.lvl = 2;
  S.stats.branches = (S.stats.branches||0) + 1;
  S.stats.maxTowerLevel = Math.max(S.stats.maxTowerLevel, 3);
  AudioSys.play('upgrade');
  ring(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, def.color, 4, V.cs*1.1, 0.5, 2.5);
  burst(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, def.color, 14, 140, 0.45);
  floater(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs - 14, t(brDef.key), def.color, true);
  checkAch();
}
function sellTower(tw){
  const refund = Math.round(tw.invested*0.7);
  G.cash += refund;
  G.towerGrid.delete(tw.c+','+tw.r);
  const i = G.towers.indexOf(tw);
  if (i>=0) G.towers.splice(i,1);
  if (G.selected === tw) G.selected = null;
  AudioSys.play('sell');
  floater(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, '+$'+refund, '#a8ff3e');
}

/* ---------- Прицеливание и стрельба ---------- */
function acquireTarget(tw, lv){
  const r2 = lv.range*lv.range;
  let best = null, bestKey = -Infinity;
  for (const e of EP){
    if (!e.alive || e.dead || e.phased) continue;
    if (dist2(tw.x, tw.y, e.x, e.y) > r2) continue;
    let key;
    if (tw.mode === 'last') key = -e.dist;
    else if (tw.mode === 'strong') key = e.hp + e.shield;
    else key = e.dist;
    if (key > bestKey){ bestKey = key; best = e; }
  }
  return best;
}
function fireHitscan(tw, e, def, lv, dmgMul){
  const x1 = V.ox+tw.x*V.cs, y1 = V.oy+tw.y*V.cs;
  const x2 = V.ox+e.x*V.cs, y2 = V.oy+e.y*V.cs;
  tracer(x1,y1,x2,y2, def.color, 0.09, def.kind==='sniper' ? 2.5 : 1.5);
  burst(x2,y2, def.color, def.kind==='sniper' ? 6 : 2, 90, 0.25);
  tw.aim = Math.atan2(e.y-tw.y, e.x-tw.x);
  damage(e, lv.dmg*dmgMul, def.kind==='sniper' ? lv.pierce : 0, false, tw.type);
  AudioSys.play(def.kind==='sniper' ? 'snipe' : 'pulse');
}
function fireTesla(tw, primary, lv, dmgMul){
  const hit = [primary];
  let cur = primary;
  const link2 = 1.9*1.9;
  while (hit.length < lv.chain){
    let best = null, bd = Infinity;
    for (const e of EP){
      if (!e.alive || e.dead || e.phased || hit.includes(e)) continue;
      const d2 = dist2(cur.x, cur.y, e.x, e.y);
      if (d2 < link2 && d2 < bd){ bd = d2; best = e; }
    }
    if (!best) break;
    hit.push(best); cur = best;
  }
  const pts = [[V.ox+tw.x*V.cs, V.oy+tw.y*V.cs]];
  hit.forEach((e,i)=>{
    damage(e, lv.dmg*dmgMul*Math.pow(0.75,i), 2, false, tw.type);
    pts.push([V.ox+e.x*V.cs, V.oy+e.y*V.cs]);
  });
  zapFx(pts, '#c9a6ff');
  tw.aim = Math.atan2(primary.y-tw.y, primary.x-tw.x);
  AudioSys.play('tesla');
}
function fireToxin(tw, e, lv, dmgMul){
  tracer(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, V.ox+e.x*V.cs, V.oy+e.y*V.cs, TOWERS.toxin.color, 0.12, 1.5);
  tw.aim = Math.atan2(e.y-tw.y, e.x-tw.x);
  if (!e.phased){
    e.poisonS = Math.min(lv.cap||8, (e.poisonS||0) + 1);
    e.poisonT = 4;
    e.poisonDps = lv.dmg*dmgMul;
    if (lv.acid) e.poisonAcid = true;
  }
  damage(e, 4*dmgMul, 99, true, tw.type);
  AudioSys.play('toxin');
}
function fireMissile(tw, e, lv, dmgMul){
  const b = bpGet();
  if (b){
    b.alive = true; b.x = tw.x; b.y = tw.y; b.px = tw.x; b.py = tw.y;
    b.tgt = e; b.lx = e.x; b.ly = e.y; b.spd = 7; b.src = tw.type;
    b.dmg = lv.dmg*dmgMul; b.rad = lv.splash; b.color = TOWERS.missile.color;
  }
  tw.aim = Math.atan2(e.y-tw.y, e.x-tw.x);
  AudioSys.play('missile');
}
function explode(b){
  b.alive = false;
  const px = V.ox+b.x*V.cs, py = V.oy+b.y*V.cs;
  burst(px,py,'#ffb020',14,190,0.45);
  ring(px,py,b.color, b.rad*V.cs*0.2, b.rad*V.cs, 0.3, 2.5);
  AudioSys.play('boom'); G.shake(3);
  const r2 = b.rad*b.rad;
  for (const e of EP){
    if (!e.alive || e.dead || e.phased) continue;
    const d2 = dist2(b.x, b.y, e.x, e.y);
    if (d2 <= r2){
      const f = 1 - 0.5*Math.sqrt(d2)/b.rad;
      damage(e, b.dmg*f, 1, false, b.src);
    }
  }
}
function beamTick(tw, def, lv, dt, dmgMul){
  let e = tw.targetRef;
  const valid = e && e.alive && !e.dead && !e.phased && dist2(tw.x,tw.y,e.x,e.y) <= lv.range*lv.range;
  if (!valid){ e = acquireTarget(tw, lv); tw.exposure = 0; }
  tw.targetRef = e || null;
  if (!e) return;
  tw.exposure = Math.min(3, tw.exposure + dt);
  tw.aim = Math.atan2(e.y-tw.y, e.x-tw.x);
  damage(e, lv.dmg*dmgMul*(1 + lv.ramp*tw.exposure)*dt, 0, true, tw.type);
  tw.tickT -= dt;
  if (tw.tickT <= 0){ tw.tickT = 0.12; AudioSys.play('beamtick'); }
}

/* ---------- Обновление сущностей ---------- */
function updateEnemies(dt){
  G.enemiesCount = 0;
  let boss = null;
  for (const e of EP){
    if (!e.alive || e.dead) continue;
    G.enemiesCount++;
    if (e.boss) boss = e;
    // оглушение (ЭМИ-импульс)
    if (e.stunT > 0){
      e.stunT -= dt;
      e.slowF = 0; e.slowT = 0;
      e.dist += 0; // стоит на месте
      const p0 = posAt(e.pts, e.dist); e.x = p0.x; e.y = p0.y; e.ang = p0.ang;
      e.hitF = Math.max(0, e.hitF - dt);
      continue;
    }
    // замедление
    if (e.slowT > 0){ e.slowT -= dt; e.speed = e.baseSpeed*(1-e.slowF); }
    else { e.slowF = 0; e.speed = e.baseSpeed; }
    // яд: тик мимо брони
    if (e.poisonT > 0){
      e.poisonT -= dt;
      damage(e, (e.poisonS||0)*(e.poisonDps||0)*dt, 99, true, 'toxin');
      if (e.poisonT <= 0){ e.poisonS = 0; e.poisonAcid = false; }
    }
    // медик лечит союзников
    if (e.def.heal){
      e.healT -= dt;
      if (e.healT <= 0){
        e.healT = e.def.heal.per;
        const r2 = e.def.heal.rad*e.def.heal.rad;
        let healed = false;
        for (const a of EP){
          if (!a.alive || a.dead || a === e) continue;
          if (dist2(a.x,a.y,e.x,e.y) <= r2 && a.hp < a.maxhp){
            a.hp = Math.min(a.maxhp, a.hp + e.healAmt); healed = true;
          }
        }
        if (healed){
          ring(V.ox+e.x*V.cs, V.oy+e.y*V.cs, '#3dff8f', 4, e.def.heal.rad*V.cs, 0.4, 1.5);
          AudioSys.play('heal');
        }
      }
    }
    // фантом фазируется
    if (e.def.phase){
      e.phaseT += dt;
      e.phased = (e.phaseT % e.def.phase.every) < e.def.phase.dur;
    }
    // эгида: регенерация щита
    if (e.maxshield > 0){
      e.shieldT += dt;
      if (e.shieldT > 3) e.shield = Math.min(e.maxshield, e.shield + e.def.shieldRegen*dt);
    }
    e.hitF = Math.max(0, e.hitF - dt);
    e.dist += e.speed*dt;
    if (e.dist >= e.len){ leakEnemy(e); continue; }
    const p = posAt(e.pts, e.dist);
    e.x = p.x; e.y = p.y; e.ang = p.ang;
  }
  G.bossRef = boss;
}

/* Уровень башни с учётом выбранной ветки 3-го уровня */
function lvOf(tw){
  return tw.lvOverride || TOWERS[tw.type].lv[tw.lvl];
}

function updateTowers(dt){
  const dmgMul = metaVals().dmgMul;
  const overMul = G.abil.over.active > 0 ? ABILITIES.over.mult : 1;
  // аура Амплиферов: считаем усиление каждой башне (усилители не складываются с собой)
  for (const tw of G.towers) tw.amp = 1;
  for (const a of G.towers){
    if (TOWERS[a.type].kind !== 'amp' || a.stun > 0) continue;
    const alv = lvOf(a);
    const r2 = alv.range*alv.range;
    for (const tw of G.towers){
      if (tw === a || TOWERS[tw.type].kind === 'amp') continue;
      if (dist2(a.x, a.y, tw.x, tw.y) <= r2) tw.amp *= (1 + alv.boost);
    }
  }
  for (const tw of G.towers){
    const def = TOWERS[tw.type], lv = lvOf(tw);
    if (tw.stun > 0){ tw.stun -= dt; continue; }
    if (def.kind === 'amp'){
      tw.prodT -= dt; // переиспользуем таймер для пульса ауры
      if (tw.prodT <= 0){ tw.prodT = 1.2; }
      continue;
    }
    if (def.kind === 'bank'){
      tw.prodT -= dt;
      if (tw.prodT <= 0){
        tw.prodT = lv.cycle;
        const inc = Math.round(lv.prod*metaVals().rewardMul);
        G.cash += inc; S.stats.money += inc;
        floater(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs - 10, '+$'+inc, '#a8ff3e');
        ring(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, def.color, 3, V.cs*0.5, 0.35, 1.5);
        AudioSys.play('coin');
      }
      continue;
    }
    if (def.kind === 'cryo'){
      const r2 = lv.range*lv.range;
      for (const e of EP){
        if (!e.alive || e.dead) continue;
        if (dist2(tw.x, tw.y, e.x, e.y) > r2) continue;
        if (!e.phased){ e.slowF = Math.max(e.slowF, lv.slow*(e.boss ? 0.5 : 1)); e.slowT = 0.25; }
        damage(e, lv.dmg*dt, 99, true, tw.type);
      }
      continue;
    }
    if (def.kind === 'poison'){
      tw.cd -= dt*overMul;
      if (tw.cd <= 0){
        const e = acquireTarget(tw, lv);
        if (e){ fireToxin(tw, e, lv, dmgMul); tw.cd = 1/lv.rate; }
        else tw.cd = 0;
      }
      continue;
    }
    if (def.kind === 'beam'){ beamTick(tw, def, lv, dt, dmgMul*tw.amp*overMul); continue; }
    tw.cd -= dt*overMul;
    if (tw.cd <= 0){
      const e = acquireTarget(tw, lv);
      if (e){
        if (def.kind === 'tesla') fireTesla(tw, e, lv, dmgMul*tw.amp);
        else if (def.kind === 'missile') fireMissile(tw, e, lv, dmgMul*tw.amp);
        else fireHitscan(tw, e, def, lv, dmgMul*tw.amp);
        tw.cd = 1/lv.rate;
      } else tw.cd = 0;
    }
  }
}

function updateBullets(dt){
  for (const b of BP){
    if (!b.alive) continue;
    if (b.tgt && b.tgt.alive && !b.tgt.dead && !b.tgt.phased){ b.lx = b.tgt.x; b.ly = b.tgt.y; }
    b.px = b.x; b.py = b.y;
    const dx = b.lx-b.x, dy = b.ly-b.y, d = Math.hypot(dx,dy);
    const step = b.spd*dt;
    if (d <= step || d < 0.001){ b.x = b.lx; b.y = b.ly; explode(b); }
    else { b.x += dx/d*step; b.y += dy/d*step; }
  }
}

function updateFx(dt){
  for (const p of PP){
    if (!p.alive) continue;
    p.t += dt;
    if (p.t >= p.ttl){ p.alive = false; continue; }
    if (p.kind === 'spark'){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= (1-2.4*dt); p.vy *= (1-2.4*dt); }
  }
  for (const tr of TX){ if (tr.alive){ tr.t += dt; if (tr.t >= tr.ttl) tr.alive = false; } }
  for (const f of FP){ if (f.alive){ f.t += dt; if (f.t >= f.ttl) f.alive = false; } }
}

/* ---------- Управление волной ---------- */
function startWave(){
  if (G.waveState !== 'prep' || G.state !== 'play') return;
  G.wave++;
  G.curWave = G.nextWave || buildWave(G.mapIdx, G.wave, G.endless);
  G.nextWave = null;
  G.events = waveEvents(G.curWave, G.paths.length);
  G.waveT = 0; G.waveState = 'running'; G.leaksThisWave = 0;
  AudioSys.play(G.curWave.bossWave ? 'boss' : 'wavestart');
  UI.banner(G.curWave.bossWave ? t('boss_wave')
    : (G.endless ? t('wave_endless', { n:G.wave }) : t('wave_tpl', { n:G.wave, m:WAVES_PER_MAP })), G.curWave.bossWave);
  // анонс модификатора волны
  if (G.curWave.mod){
    const wm = WAVE_MODS[G.curWave.mod];
    UI.banner(t(wm.key), true);
    UI.toast(t(wm.key)+' · '+t(wm.descKey), 'warn');
  }
  // интро новых врагов/мутаций — ненавязчивые тосты
  for (const g of G.curWave.groups){
    const ek = 'en_'+g.type;
    if (!S.seen[ek]){
      S.seen[ek] = 1;
      if (g.type !== 'drone') UI.toast(t('new_enemy', { name:t(ENEMIES[g.type].key) }), 'warn');
    }
    if (g.mut && !S.seen['mut_'+g.mut]){
      S.seen['mut_'+g.mut] = 1;
      UI.toast(t('new_mut', { name:t(MUT[g.mut].key) }), 'warn');
    }
  }
  UI.hintDismiss('wave');
  UI.refreshWaveUI();
}

function waveClear(){
  const bonus = Math.round((15 + G.wave*2) * metaVals().rewardMul);
  G.cash += bonus; S.stats.money += bonus;
  AudioSys.play('coin');
  const cx = V.ox+(G.core[0]+0.5)*V.cs, cy = V.oy+(G.core[1]+0.5)*V.cs;
  floater(cx, cy-30, '+$'+bonus, '#a8ff3e');
  if (G.leaksThisWave === 0){
    G.cleanStreak++;
    S.stats.bestCleanWave = Math.max(S.stats.bestCleanWave, G.cleanStreak);
  } else G.cleanStreak = 0;
  if (G.endless){
    const ms = mapSave(G.mapIdx);
    ms.best = Math.max(ms.best, G.wave);
    const mile = Math.floor(G.wave/10);
    if (mile > Math.floor(ms.milestone/10)){
      const k = mile - Math.floor(ms.milestone/10);
      addCores(k*5);
      ms.milestone = mile*10;
      UI.toast(t('t_core', { n:k*5 }));
    }
    persist(); checkAch();
    G.waveState = 'prep';
    G.nextWave = buildWave(G.mapIdx, G.wave+1, true);
  } else if (G.wave >= WAVES_PER_MAP){
    victory();
    return;
  } else {
    G.waveState = 'prep';
    G.nextWave = buildWave(G.mapIdx, G.wave+1, false);
    persist();
  }
  checkAch();
  UI.refreshWaveUI();
}

function victory(){
  G.state = 'won';
  const ms = mapSave(G.mapIdx);
  const beforeStars = totalStars();
  const lost = G.maxLives - G.lives;
  const stars = lost === 0 ? 3 : (lost <= 4 ? 2 : 1);
  const firstWin = ms.stars === 0;
  const earned = (firstWin ? 8 + 2*G.mapIdx : 0) + Math.max(0, stars - ms.stars)*3;
  ms.stars = Math.max(ms.stars, stars);
  if (earned > 0) addCores(earned);
  // что разблокировалось
  const newMaps = MAPS.map((m,i)=>i).filter(i=>MAPS[i].need > beforeStars && MAPS[i].need <= totalStars());
  const newTowers = TOWER_ORDER.filter(tp=>UNLOCK_STARS[tp] > beforeStars && UNLOCK_STARS[tp] <= totalStars() && UNLOCK_STARS[tp] > 0);
  persist(); checkAch();
  AudioSys.play('win');
  haptic('success');
  UI.openVictory({ stars, earned, firstWin, newMaps, newTowers });
}

function defeat(){
  if (G.state !== 'play') return;
  G.state = 'lost';
  if (G.endless){
    const ms = mapSave(G.mapIdx);
    ms.best = Math.max(ms.best, Math.max(0, G.wave-1));
  }
  persist(); checkAch();
  AudioSys.play('lose');
  haptic('error');
  UI.openDefeat();
}

/* ---------- Главный update партии ---------- */
function updateGame(rawDt){
  if (!G.active || G.state !== 'play') return;
  if (G.slowmoT > 0) G.slowmoT -= rawDt;
  const dt = rawDt * (G.slowmoT > 0 ? 0.3 : 1);
  G.time += dt;
  if (G.waveState === 'running'){
    G.waveT += dt;
    while (G.events.length && G.events[0].t <= G.waveT){
      const ev = G.events.shift();
      const e = spawnEnemy(ev.type, G.wave, G.map.mult, ev.path, ev.mut, 0, ev.variant);
      if (e && e.boss) G.shake(8);
    }
  }
  updateEnemies(dt);
  updateTowers(dt);
  updateBullets(dt);
  updateFx(dt);
  if (G.waveState === 'running' && G.events.length === 0 && G.enemiesCount === 0) waveClear();
  G.coreFlash = Math.max(0, G.coreFlash - dt*1.4);
  if (G.shakeT > 0){ G.shakeT -= rawDt; if (G.shakeT <= 0) G.shakeAmp = 0; }
  // способности: перезарядка и активный эффект (в реальном времени, без слоу-мо)
  for (const k in G.abil){
    if (G.abil[k].cd > 0) G.abil[k].cd = Math.max(0, G.abil[k].cd - rawDt);
  }
  if (G.abil.over.active > 0) G.abil.over.active = Math.max(0, G.abil.over.active - rawDt);
  if (G.coreCharge >= 100) coreNova();
  // автостарт волн
  if (S.auto && G.waveState === 'prep' && G.state === 'play'){
    if (G.autoT > 0){ G.autoT -= rawDt; if (G.autoT <= 0) startWave(); }
    else G.autoT = 1.2;
  } else G.autoT = 0;
}
G.shake = function(amp){
  if (amp > G.shakeAmp) G.shakeAmp = amp;
  G.shakeT = 0.3;
};

/* Нова ядра: разряд накопленного заряда по всем вирусам на поле */
function coreNova(){
  G.coreCharge = 0;
  const cx = V.ox+(G.core[0]+0.5)*V.cs, cy = V.oy+(G.core[1]+0.5)*V.cs;
  ring(cx, cy, '#9ef7ff', 10, 14*V.cs, 0.7, 4);
  ring(cx, cy, '#00e5ff', 6, 11*V.cs, 0.5, 2);
  AudioSys.play('nova');
  G.shake(10);
  floater(cx, cy-40, t('nova'), '#9ef7ff', true);
  for (const e of EP){
    if (!e.alive || e.dead) continue;
    damage(e, e.maxhp*0.10 + 15, 99, true);
  }
}

/* ---- Способности ---- */
function castEmp(c, r){
  const ab = G.abil.emp;
  if (ab.cd > 0 || G.state !== 'play'){ AudioSys.play('error'); return; }
  ab.cd = ABILITIES.emp.cd;
  G.targeting = null;
  const cx = c+0.5, cy = r+0.5;
  const r2 = ABILITIES.emp.radius*ABILITIES.emp.radius;
  let hit = 0;
  for (const e of EP){
    if (!e.alive || e.dead) continue;
    if (dist2(cx, cy, e.x, e.y) <= r2){
      e.stunT = ABILITIES.emp.stun*(e.boss ? 0.5 : 1);
      hit++;
    }
  }
  const px = V.ox+cx*V.cs, py = V.oy+cy*V.cs;
  ring(px, py, '#7df9ff', 6, ABILITIES.emp.radius*V.cs, 0.5, 3);
  burst(px, py, '#7df9ff', 16, 200, 0.4);
  AudioSys.play('emp');
  G.shake(4);
  floater(px, py, hit ? 'STUN ×'+hit : '—', '#7df9ff');
}
function activateOver(){
  const ab = G.abil.over;
  if (ab.cd > 0 || G.state !== 'play'){ AudioSys.play('error'); return; }
  ab.cd = ABILITIES.over.cd;
  ab.active = ABILITIES.over.dur;
  AudioSys.play('over');
  G.shake(3);
  for (const tw of G.towers) ring(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, '#ffb020', 4, V.cs*0.7, 0.4, 2);
}

/* ==================== РЕНДЕР ==================== */
function strokePoly(c, pts){
  c.beginPath();
  pts.forEach((p,i)=> i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
  c.stroke();
}

function renderBoardBG(){
  if (!G.active || !G.map || !V.w) return;
  const BL = 24; // запас под тряску, рисуется 1:1 — сетка не растягивается
  boardBG = document.createElement('canvas');
  boardBG.width = Math.max(1, Math.round((V.w+BL*2)*V.dpr));
  boardBG.height = Math.max(1, Math.round((V.h+BL*2)*V.dpr));
  const c = boardBG.getContext('2d');
  c.scale(V.dpr, V.dpr);
  c.translate(BL, BL);
  V.w += BL*2; V.h += BL*2;      // рисуем расширенный фон
  drawBGContent(c);
  V.w -= BL*2; V.h -= BL*2;      // возвращаем рабочие размеры
}

function drawBGContent(c){
  const Vw = V.w + 48, Vh = V.h + 48; // покрытие с запасом за края экрана
  {
  // фон
  const g = c.createLinearGradient(0,0,V.w,V.h);
  g.addColorStop(0,'#070b18'); g.addColorStop(0.5,'#05070f'); g.addColorStop(1,'#0a0f22');
  c.fillStyle = g; c.fillRect(0,0,V.w,V.h);
  // сетка
  c.strokeStyle = 'rgba(0,229,255,0.05)'; c.lineWidth = 1;
  for (let i=0;i<=COLS;i++){ c.beginPath(); c.moveTo(V.ox+i*V.cs, V.oy); c.lineTo(V.ox+i*V.cs, V.oy+ROWS*V.cs); c.stroke(); }
  for (let j=0;j<=ROWS;j++){ c.beginPath(); c.moveTo(V.ox, V.oy+j*V.cs); c.lineTo(V.ox+COLS*V.cs, V.oy+j*V.cs); c.stroke(); }
  c.strokeStyle = 'rgba(0,229,255,0.16)';
  c.strokeRect(V.ox, V.oy, COLS*V.cs, ROWS*V.cs);
  // клетки пути
  c.fillStyle = 'rgba(0,229,255,0.05)';
  for (const k of G.pathCells){
    const [cc,cr] = k.split(',').map(Number);
    rr(c, V.ox+cc*V.cs+1.5, V.oy+cr*V.cs+1.5, V.cs-3, V.cs-3, 4); c.fill();
  }
  // трасса
  c.lineJoin = 'round'; c.lineCap = 'round';
  for (const px of G.pathPxs){
    c.strokeStyle = 'rgba(2,6,14,0.92)'; c.lineWidth = V.cs*0.52; strokePoly(c, px);
    c.strokeStyle = hexA(G.map.color, 0.25); c.lineWidth = V.cs*0.4; strokePoly(c, px);
    c.strokeStyle = hexA(G.map.color, 0.7); c.lineWidth = 1.5; strokePoly(c, px);
  }
  // декорации: серверные блоки
  for (const k of G.deco){
    const [cc,cr] = k.split(',').map(Number);
    const x = V.ox+cc*V.cs+V.cs*0.14, y = V.oy+cr*V.cs+V.cs*0.14, w = V.cs*0.72, h = V.cs*0.72;
    c.fillStyle = 'rgba(10,18,38,0.95)'; rr(c,x,y,w,h,3); c.fill();
    c.strokeStyle = 'rgba(0,229,255,0.18)'; c.lineWidth = 1; c.stroke();
    c.strokeStyle = 'rgba(0,229,255,0.25)';
    for (let i=1;i<4;i++){ c.beginPath(); c.moveTo(x+w*0.15, y+h*i/4); c.lineTo(x+w*0.85, y+h*i/4); c.stroke(); }
  }
  // фоновые «узлы данных» на свободных клетках — детализируют поле, детерминированно по клетке
  c.fillStyle = 'rgba(0,229,255,0.10)';
  for (let cc=0; cc<COLS; cc++){
    for (let cr=0; cr<ROWS; cr++){
      const k = cc+','+cr;
      if (G.pathCells.has(k) || G.deco.has(k)) continue;
      if (((cc*7 + cr*13) % 5) !== 0) continue;
      const x = V.ox+(cc+0.5)*V.cs, y = V.oy+(cr+0.5)*V.cs;
      c.beginPath(); c.arc(x, y, Math.max(1.5, V.cs*0.045), 0, TAU); c.fill();
    }
  }
  // площадки стройки: едва заметные скругления в зонах
  c.strokeStyle = 'rgba(0,229,255,0.14)';
  c.lineWidth = 1;
  for (const k of G.buildable){
    const [cc,cr] = k.split(',').map(Number);
    rr(c, V.ox+cc*V.cs+3, V.oy+cr*V.cs+3, V.cs-6, V.cs-6, 4); c.stroke();
  }
  }
}

function drawPathFlow(ctx){
  ctx.save();
  ctx.strokeStyle = hexA(G.map.color, 0.55);
  ctx.lineWidth = Math.max(2, V.cs*0.055);
  ctx.lineCap = 'round';
  ctx.setLineDash([V.cs*0.22, V.cs*0.38]);
  ctx.lineDashOffset = -G.time*V.cs*1.1;
  for (const px of G.pathPxs) strokePoly(ctx, px);
  ctx.restore();
}

function drawPortals(ctx){
  G.paths.forEach((pts, i)=>{
    const cell = pts.find(p=>p[0]>=0 && p[0]<COLS && p[1]>=0 && p[1]<ROWS) || pts[0];
    const cx = V.ox+(cell[0]+0.5)*V.cs, cy = V.oy+(cell[1]+0.5)*V.cs;
    const t = G.time*2 + i*2.1;
    drawGlow(ctx, cx, cy, V.cs*0.5, G.map.color, 0.35);
    ctx.strokeStyle = hexA(G.map.color, 0.85); ctx.lineWidth = 2;
    for (let k=0;k<2;k++){
      ctx.beginPath(); ctx.arc(cx, cy, V.cs*(0.26+k*0.12), t+k*2, t+k*2+2.2); ctx.stroke();
    }
  });
}

function drawCore(ctx){
  const cx = V.ox+(G.core[0]+0.5)*V.cs, cy = V.oy+(G.core[1]+0.5)*V.cs;
  const pulse = 1 + Math.sin(G.time*3)*0.06;
  drawGlow(ctx, cx, cy, V.cs*1.05*pulse, '#00e5ff', 0.5 + G.coreFlash*0.5);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(G.time*0.7);
  ctx.strokeStyle = hexA('#00e5ff', 0.9); ctx.lineWidth = 2;
  for (let i=0;i<3;i++){
    ctx.rotate(TAU/3);
    ctx.beginPath(); ctx.arc(0, 0, V.cs*0.52, 0.15, 1.35); ctx.stroke();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, V.cs*0.24*pulse, 0, TAU);
  ctx.fillStyle = G.coreFlash > 0 ? hexA('#ff3355', 0.4+G.coreFlash*0.6) : '#9ef7ff';
  ctx.fill();
  const frac = clamp(G.lives/G.maxLives, 0, 1);
  ctx.beginPath(); ctx.arc(cx, cy, V.cs*0.66, -TAU/4, -TAU/4 + TAU*frac);
  ctx.strokeStyle = frac > 0.5 ? '#a8ff3e' : (frac > 0.25 ? '#ffb020' : '#ff3355');
  ctx.lineWidth = 3; ctx.stroke();
  // дуга заряда новы
  const ch = clamp((G.coreCharge||0)/100, 0, 1);
  if (ch > 0){
    ctx.beginPath(); ctx.arc(cx, cy, V.cs*0.42, -TAU/4, -TAU/4 + TAU*ch);
    ctx.strokeStyle = 'rgba(158,247,255,'+(ch >= 1 ? 1 : 0.75)+')';
    ctx.lineWidth = 2.5; ctx.stroke();
  }
}

function drawEnemies(ctx){
  // проход 1: все глоу-спрайты одним композитным окном (дешевле, чем save/restore на каждого)
  if (!S.lowgfx){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const e of EP){
      if (!e.alive || e.dead) continue;
      const px = V.ox+e.x*V.cs, py = V.oy+e.y*V.cs;
      let col = e.mut ? MUT[e.mut].color : e.def.color;
      if (G.curWave && G.curWave.mod === 'gold' && !e.boss) col = WAVE_MODS.gold.color;
      const s = e.def.r*V.cs*1.7;
      ctx.globalAlpha = e.phased ? 0.1 : 0.35;
      ctx.drawImage(glowSprite(col), px-s, py-s, s*2, s*2);
    }
    ctx.restore();
  }
  // проход 2: фигуры, щиты, полоски HP
  const goldWave = G.curWave && G.curWave.mod === 'gold';
  for (const e of EP){
    if (!e.alive || e.dead) continue;
    const px = V.ox+e.x*V.cs, py = V.oy+e.y*V.cs;
    let col = e.mut ? MUT[e.mut].color : e.def.color;
    if (goldWave && !e.boss) col = WAVE_MODS.gold.color; // золотая волна перекрашивает рой
    const R = e.def.r*V.cs;
    const alpha = e.phased ? 0.22 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawEnemyShape(ctx, e.def.shape, px, py, R, e.ang, e.hitF > 0 ? '#ffffff' : col, Math.max(1.5, V.cs*0.055), G.time, e.id);
    // мерцающий двигатель позади
    const thx = px - Math.cos(e.ang)*R*1.15, thy = py - Math.sin(e.ang)*R*1.15;
    ctx.globalAlpha = alpha * (0.25 + 0.35*Math.abs(Math.sin(G.time*13 + e.id)));
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(thx, thy, Math.max(1.2, R*0.14), 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha;
    if (e.stunT > 0 && Math.random() < 0.35) burst(px, py - R, '#ffd12d', 1, 45, 0.3);
    // пузырьки яда
    if (e.poisonS > 0){
      ctx.fillStyle = hexA('#c8ff00', 1);
      for (let i=0;i<Math.min(3, 1+Math.floor(e.poisonS/3));i++){
        const ph = (G.time*1.4 + i*0.37 + (e.id%7)*0.13) % 1;
        ctx.globalAlpha = alpha * (1-ph) * 0.8;
        ctx.beginPath();
        ctx.arc(px + Math.sin((e.id+i)*2.6)*R*0.4, py - R*0.4 - ph*R*1.4, 1.5+ph*2.2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = alpha;
    }
    if (e.shield > 0){
      ctx.strokeStyle = hexA('#4dc3ff', 0.85); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, R*1.4, -TAU/4, -TAU/4 + TAU*(e.shield/e.maxshield)); ctx.stroke();
    }
    ctx.restore();
    if (e.hp < e.maxhp - 0.5 && !e.boss){
      const w = V.cs*0.6, h = 3, frac = clamp(e.hp/e.maxhp, 0, 1);
      const bx = px-w/2, by = py-R-9;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = frac > 0.5 ? '#a8ff3e' : (frac > 0.25 ? '#ffb020' : '#ff3355');
      ctx.fillRect(bx, by, w*frac, h);
    }
  }
}

function drawTowers(ctx){
  // линии усиления Амплиферов
  for (const a of G.towers){
    if (TOWERS[a.type].kind !== 'amp') continue;
    const alv = lvOf(a);
    const r2 = alv.range*alv.range;
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.1*Math.sin(G.time*3);
    ctx.strokeStyle = TOWERS.amp.color;
    ctx.lineWidth = 1;
    ctx.setLineDash([3,5]);
    for (const tw of G.towers){
      if (tw === a || TOWERS[tw.type].kind === 'amp') continue;
      if (dist2(a.x, a.y, tw.x, tw.y) > r2) continue;
      ctx.beginPath();
      ctx.moveTo(V.ox+a.x*V.cs, V.oy+a.y*V.cs);
      ctx.lineTo(V.ox+tw.x*V.cs, V.oy+tw.y*V.cs);
      ctx.stroke();
    }
    ctx.restore();
  }
  for (const tw of G.towers){
    const px = V.ox+tw.x*V.cs, py = V.oy+tw.y*V.cs;
    const def = TOWERS[tw.type];
    if (tw.stun > 0 && Math.random() < 0.25) burst(px, py, '#ffd12d', 1, 60, 0.3);
    drawTowerAt(ctx, tw.type, tw.lvl+1, px, py, V.cs, tw.aim, def.color);
    // метка выбранной специализации
    if (tw.branch){
      ctx.font = '700 10px Consolas,monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(5,8,18,0.85)';
      ctx.fillRect(px+V.cs*0.16, py-V.cs*0.46, 13, 12);
      ctx.fillStyle = def.color;
      ctx.fillText(tw.branch.toUpperCase(), px+V.cs*0.16+6.5, py-V.cs*0.46+9.5);
    }
    if (tw.stun > 0){
      ctx.strokeStyle = 'rgba(255,209,45,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, V.cs*0.44, 0, TAU); ctx.stroke();
    }
    // подсветка активной Перегрузки
    if (G.abil.over.active > 0){
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3*Math.sin(G.time*8);
      ctx.strokeStyle = '#ffb020'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, V.cs*0.5, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawRange(ctx, px, py, range, color){
  ctx.save();
  ctx.fillStyle = hexA(color, 0.06);
  ctx.beginPath(); ctx.arc(px, py, range*V.cs, 0, TAU); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.55); ctx.lineWidth = 1.5;
  ctx.setLineDash([6,6]); ctx.stroke();
  ctx.restore();
}

function drawBulletsFx(ctx){
  // ракеты
  for (const b of BP){
    if (!b.alive) continue;
    const px = V.ox+b.x*V.cs, py = V.oy+b.y*V.cs;
    const qx = V.ox+b.px*V.cs, qy = V.oy+b.py*V.cs;
    ctx.strokeStyle = hexA(b.color, 0.6); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke();
    drawGlow(ctx, px, py, 5, b.color, 0.9);
    ctx.fillStyle = '#fff'; ctx.fillRect(px-1.5, py-1.5, 3, 3);
  }
  // трассы и молнии
  for (const tr of TX){
    if (!tr.alive) continue;
    const k = 1 - tr.t/tr.ttl;
    ctx.save();
    ctx.globalAlpha = k;
    ctx.strokeStyle = tr.color; ctx.lineWidth = tr.width;
    if (tr.kind === 'tracer'){
      ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke();
    } else {
      zapPath(ctx, tr.pts[0][0], tr.pts[0][1], tr.pts[tr.pts.length-1][0], tr.pts[tr.pts.length-1][1], 7);
      // ломаная через все точки цепи
      ctx.beginPath();
      for (let i=0;i<tr.pts.length-1;i++){
        const a = tr.pts[i], b2 = tr.pts[i+1];
        ctx.moveTo(a[0], a[1]);
        const segs = 4;
        for (let s=1;s<segs;s++){
          const kk = s/segs;
          ctx.lineTo(lerp(a[0],b2[0],kk)+rnd(-6,6), lerp(a[1],b2[1],kk)+rnd(-6,6));
        }
        ctx.lineTo(b2[0], b2[1]);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  // частицы
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of PP){
    if (!p.alive) continue;
    const k = p.t/p.ttl;
    if (p.kind === 'spark'){
      ctx.globalAlpha = 1-k;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    } else {
      ctx.globalAlpha = (1-k)*0.9;
      ctx.strokeStyle = p.color; ctx.lineWidth = p.width;
      ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.size, p.r1, k), 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
  // лучи башен (поверх)
  for (const tw of G.towers){
    if (TOWERS[tw.type].kind !== 'beam' || !tw.targetRef) continue;
    const e = tw.targetRef;
    if (!e.alive || e.dead) continue;
    const px = V.ox+tw.x*V.cs, py = V.oy+tw.y*V.cs;
    const ex = V.ox+e.x*V.cs, ey = V.oy+e.y*V.cs;
    const w = 2 + Math.sin(G.time*20)*0.8 + tw.exposure*0.8;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hexA(TOWERS.beam.color, 0.35); ctx.lineWidth = w*2.4;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle = '#ffd9b0'; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.restore();
  }
  // всплывающий текст
  for (const f of FP){
    if (!f.alive) continue;
    const k = f.t/f.ttl;
    ctx.save();
    ctx.globalAlpha = 1-k*k;
    ctx.fillStyle = f.color;
    ctx.font = (f.big ? 700 : 600)+' '+Math.round(f.big ? V.cs*0.34 : V.cs*0.24)+'px Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y - 34*k);
    ctx.restore();
  }
}

function drawGhostAndSelection(ctx){
  if (G.selected && !G.towers.includes(G.selected)) G.selected = null;
  if (G.selected){
    const tw = G.selected, def = TOWERS[tw.type], lv = lvOf(tw);
    drawRange(ctx, V.ox+tw.x*V.cs, V.oy+tw.y*V.cs, lv.range, def.color);
  }
  // прицел ЭМИ-импульса
  if (G.targeting === 'emp' && G.hoverCell){
    const [c,r] = G.hoverCell;
    const px = V.ox+(c+0.5)*V.cs, py = V.oy+(r+0.5)*V.cs;
    const rad = ABILITIES.emp.radius*V.cs;
    const pulse = 1 + 0.05*Math.sin(G.time*6);
    ctx.save();
    ctx.fillStyle = hexA('#7df9ff', 0.07);
    ctx.beginPath(); ctx.arc(px, py, rad*pulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA('#7df9ff', 0.8); ctx.lineWidth = 2;
    ctx.setLineDash([8,6]);
    ctx.lineDashOffset = -G.time*30;
    ctx.beginPath(); ctx.arc(px, py, rad*pulse, 0, TAU); ctx.stroke();
    ctx.restore();
    if (G.abil.emp.cd > 0){
      ctx.fillStyle = 'rgba(255,51,85,0.8)';
      ctx.font = '700 13px Consolas,monospace';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(G.abil.emp.cd)+'s', px, py - rad - 8);
    }
  }
  // наведение на установленную башню: слабое кольцо + подпись
  if (!G.placing && !G.selected && G.hoverCell){
    const h = towerAt(G.hoverCell[0], G.hoverCell[1]);
    if (h){
      const def = TOWERS[h.type], lv = lvOf(h);
      const px = V.ox+h.x*V.cs, py = V.oy+h.y*V.cs;
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawRange(ctx, px, py, lv.range, def.color);
      ctx.restore();
      const label = t(def.key)+' · '+t('lvl_short')+' '+(h.lvl+1);
      ctx.font = '600 12px Consolas,monospace';
      ctx.textAlign = 'center';
      const w = ctx.measureText(label).width + 14;
      const ly = clamp(py - V.cs*0.55 - 22, 6, V.h - 24);
      ctx.fillStyle = 'rgba(5,8,18,0.85)';
      rr(ctx, px-w/2, ly, w, 18, 5); ctx.fill();
      ctx.strokeStyle = hexA(def.color, 0.5); ctx.lineWidth = 1;
      rr(ctx, px-w/2, ly, w, 18, 5); ctx.stroke();
      ctx.fillStyle = def.color;
      ctx.fillText(label, px, ly+13);
    }
  }
  if (G.placing && G.hoverCell){
    const [c,r] = G.hoverCell;
    const def = TOWERS[G.placing], lv = def.lv[0];
    const ok = canPlace(c,r) && G.cash >= def.cost;
    const px = V.ox+(c+0.5)*V.cs, py = V.oy+(r+0.5)*V.cs;
    drawRange(ctx, px, py, lv.range, ok ? def.color : '#ff3355');
    ctx.save(); ctx.globalAlpha = 0.6;
    drawTowerAt(ctx, G.placing, 1, px, py, V.cs, -TAU/8, ok ? def.color : '#ff3355');
    ctx.restore();
    if (ok){
      ctx.strokeStyle = hexA(def.color, 0.8); ctx.lineWidth = 1.5;
      ctx.strokeRect(V.ox+c*V.cs+1.5, V.oy+r*V.cs+1.5, V.cs-3, V.cs-3);
    } else {
      ctx.strokeStyle = 'rgba(255,51,85,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px-V.cs*0.2, py-V.cs*0.2); ctx.lineTo(px+V.cs*0.2, py+V.cs*0.2);
      ctx.moveTo(px+V.cs*0.2, py-V.cs*0.2); ctx.lineTo(px-V.cs*0.2, py+V.cs*0.2);
      ctx.stroke();
    }
  }
}

function renderGame(){
  if (!G.active) return;
  const ctx = bctx;
  ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  // сброс состояния: сбой в прошлом кадре не должен «протекать» в этот
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);
  let sx = 0, sy = 0;
  if (G.shakeT > 0){
    const k = (G.shakeT/0.3)*G.shakeAmp;
    sx = rnd(-k,k); sy = rnd(-k,k);
  }
  ctx.save();
  try{
    ctx.translate(sx, sy);
    // фон непрозрачный, нарисован с запасом и накладывается 1:1 — сетка не плывёт
    if (boardBG) ctx.drawImage(boardBG, -24, -24, (V.w+48), (V.h+48));
    drawPathFlow(ctx);
    drawPortals(ctx);
    drawCore(ctx);
    drawEnemies(ctx);
    drawTowers(ctx);
    drawBulletsFx(ctx);
    drawGhostAndSelection(ctx);
  } finally {
    ctx.restore();
  }
}

          // на тач-экранах тултип = подсказка при выборе

  /* ---------- тултип у элемента-якоря ---------- */
  showTipAt(html, anchorEl){
    const el = this.els.tt;
    if (!el) return;
    el.innerHTML = html;
    el.hidden = false;
    const r = anchorEl.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = clamp(r.left + r.width/2 - w/2, 8, innerWidth - w - 8);
    let y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    el.style.left = x+'px';
    el.style.top = y+'px';
  },
  showTowerTip(type, cardEl, keyHint){
    const def = TOWERS[type];
    this.showTipAt(
      '<div class="tt-name" style="color:'+def.color+'">'+t(def.key)+'</div>'+
      '<div class="tt-desc">'+t(def.key+'_d')+'</div>'+
      '<div class="tt-rows">'+towerStatRows(def.kind, def.lv[0])+'</div>'+
      '<div class="tt-foot">$'+def.cost+(keyHint ? ' <span class="tt-key">· '+keyHint+'</span>' : '')+'</div>',
      cardEl
    );
  },

    if (this.els.tt) this.els.tt.hidden = true;

  /* ---------- HUD (каждый кадр) ---------- */
  updateHUD(force){
    const e = this.els;
    const waveNum = G.waveState === 'prep' ? G.wave+1 : G.wave;
    const waveTxt = G.endless ? t('wave_endless',{n:waveNum}) : t('wave_tpl',{n:waveNum, m:WAVES_PER_MAP});
    const cashTxt = '$'+fmtNum(G.cash);
    const livesTxt = '♥ '+G.lives;
    if (force || e.hudWave.textContent !== waveTxt) e.hudWave.textContent = waveTxt;
    if (force || e.hudCash.textContent !== cashTxt){
      e.hudCash.textContent = cashTxt;
      this.syncBuildbar();
      // инспектор не пересобираем чаще 4 раз в секунду — деньги меняются на каждом убийстве
      const nowT = performance.now();
      if (G.selected && nowT - (this.lastInsp||0) > 250){ this.lastInsp = nowT; this.renderInspector(); }
    }
    e.hudLives.textContent = livesTxt;
    e.hudLives.classList.toggle('low', G.lives <= Math.max(3, G.maxLives*0.2));
    const sp = t('speed_x',{n:G.speed});
    if (e.btnSpeed.textContent !== sp) e.btnSpeed.textContent = sp;
    // способности: кулдауны на кнопках
    const emp = G.abil.emp, over = G.abil.over;
    const empCd = emp.cd > 0 ? Math.ceil(emp.cd) : '';
    const ovCd = over.cd > 0 ? Math.ceil(over.cd) : (over.active > 0 ? Math.ceil(over.active) : '');
    if (e.abEmp.querySelector('.cdt').textContent !== (''+empCd)) e.abEmp.querySelector('.cdt').textContent = empCd;
    e.abEmp.classList.toggle('cd', emp.cd > 0);
    e.abEmp.classList.toggle('arm', G.targeting === 'emp');
    const ovEl = e.abOver.querySelector('.cdt');
    if (ovEl.textContent !== (''+ovCd)) ovEl.textContent = ovCd;
    e.abOver.classList.toggle('cd', over.cd > 0 && over.active <= 0);
    e.abOver.classList.toggle('act', over.active > 0);
    e.btnAuto.classList.toggle('on', !!S.auto);

    if (G.bossRef && G.bossRef.alive && !G.bossRef.dead){
      e.bossbar.classList.add('show');

        '<button class="btn danger" id="ins-sell">'+t('sell')+' $'+Math.round(tw.invested*0.7)+'</button>'+

/* Характеристики башни строками — общие для инспектора и тултипа */
function statList(kind, lv){
  const M = Math.round(lv.dmg*metaVals().dmgMul);
  switch (kind){
    case 'gun': case 'sniper':
      return [[t('st_dmg'), M], [t('st_rate'), lv.rate+t('sec_per')], [t('st_range'), lv.range]]
        .concat(lv.pierce ? [[t('st_pierce'), lv.pierce]] : []);
    case 'missile':
      return [[t('st_dmg'), M], [t('st_splash'), lv.splash], [t('st_rate'), lv.rate+t('sec_per')], [t('st_range'), lv.range]];
    case 'tesla':
      return [[t('st_dmg'), M], [t('st_chain'), lv.chain], [t('st_rate'), lv.rate+t('sec_per')], [t('st_range'), lv.range]];
    case 'cryo':
      return [[t('st_slow'), Math.round(lv.slow*100)+'%'], [t('st_dps'), Math.round(lv.dmg*metaVals().dmgMul)], [t('st_range'), lv.range]];
    case 'bank':
      return [[t('st_prod'), '$'+lv.prod+'/'+lv.cycle+'s']];
    case 'amp':
      return [[t('st_amp'), '+'+Math.round(lv.boost*100)+'%'], [t('st_range'), lv.range]];
    case 'poison':
      return [[t('st_poison'), lv.dmg], [t('st_rate'), lv.rate+t('sec_per')], [t('st_range'), lv.range]]
        .concat(lv.acid ? [[t('st_pierce'), '-3 '+t('st_armor_short')]] : []);
    case 'beam':
      return [[t('st_dps'), M], [t('st_ramp'), '+'+Math.round(lv.ramp*100)+'%'+t('sec_per')], [t('st_range'), lv.range]];
  }
  return [];
}
function towerStatRows(kind, lv){
  return statList(kind, lv).map(([l,v])=>'<span>'+l+'</span><b>'+v+'</b>').join('');
}
/* Сетка «текущее → следующее» для всех характеристик */
function statDiffGrid(kind, lv, nl){
  const a = statList(kind, lv), b = statList(kind, nl);
  const rows = a.map(([l,v],i)=>{
    const nv = b[i] ? b[i][1] : '—';
    const changed = (''+nv) !== (''+v);
    return '<div class="i-drow'+(changed?' ch':'')+'"><span>'+l+'</span><b>'+v+'</b><em>→</em><b'+(changed?' style="color:var(--lime)"':'')+'>'+nv+'</b></div>';
  });
  if (b.length > a.length) b.slice(a.length).forEach(([l,v])=>rows.push('<div class="i-drow ch"><span>'+l+'</span><b>—</b><em>→</em><b style="color:var(--lime)">'+v+'</b></div>'));
  return '<div class="i-diff">'+rows.join('')+'</div>';
}

/* ---------- Превью карты в карточке выбора ---------- */
function drawMapPreview(cv, m){
  const c = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const sx = (W-24)/COLS, sy = (H-16)/ROWS, s = Math.min(sx, sy);
  const ox = (W - s*COLS)/2, oy = (H - s*ROWS)/2;
  c.fillStyle = 'rgba(3,6,14,0.9)'; c.fillRect(0,0,W,H);
  c.strokeStyle = 'rgba(0,229,255,0.08)';
  for (let i=0;i<=COLS;i++){ c.beginPath(); c.moveTo(ox+i*s, oy); c.lineTo(ox+i*s, oy+ROWS*s); c.stroke(); }
  for (let j=0;j<=ROWS;j++){ c.beginPath(); c.moveTo(ox, oy+j*s); c.lineTo(ox+COLS*s, oy+j*s); c.stroke(); }
  // путь
  const P = (pt)=>[ox+(pt[0]+0.5)*s, oy+(pt[1]+0.5)*s];
  c.lineJoin = 'round'; c.lineCap = 'round';
  m.paths.forEach(wps=>{
    const pts = [];
    for (let i=0;i<wps.length-1;i++){
      const c0=wps[i][0], r0=wps[i][1], c1=wps[i+1][0], r1=wps[i+1][1];
      const sc=Math.sign(c1-c0), sr=Math.sign(r1-r0);
      let cc=c0, cr=r0; pts.push([cc,cr]);
      while (cc!==c1 || cr!==r1){ cc+=sc; cr+=sr; pts.push([cc,cr]); }
    }
    const px = pts.map(P);
    c.strokeStyle = 'rgba(2,6,14,0.9)'; c.lineWidth = s*0.5; strokePoly(c, px);
    c.strokeStyle = hexA(m.color, 0.85); c.lineWidth = 1.6; strokePoly(c, px);
    // портал
    const p0 = px[0];
    c.fillStyle = hexA(m.color, 0.9);
    c.beginPath(); c.arc(p0[0], p0[1], 3, 0, TAU); c.fill();
  });
  // ядро
  const core = P(m.paths[0][m.paths[0].length-1]);
  drawGlow(c, core[0], core[1], 8, '#00e5ff', 0.8);
  c.fillStyle = '#9ef7ff';
  c.beginPath(); c.arc(core[0], core[1], 3.5, 0, TAU); c.fill();
}

/* ---------- Фон меню: дрейфующие частицы ---------- */
const BG = { pts:[], t:0 };
function initBgfx(){
  const cv = $('bgfx');
  const resize = ()=>{
    cv.width = innerWidth; cv.height = innerHeight;
  };
  resize();
  window.addEventListener('resize', resize);
  BG.pts = [];
  for (let i=0;i<70;i++){
    BG.pts.push({ x:rnd(innerWidth), y:rnd(innerHeight), vx:rnd(-8,8), vy:rnd(-14,-4),
      s:rnd(1,2.6), c:pick(['#00e5ff','#ff2d78','#9d5cff','#a8ff3e']), a:rnd(0.1,0.5) });
  }
}
function drawBgfx(dt){
  if (UI.cur === 'game') return;
  const cv = $('bgfx'), c = cv.getContext('2d');
  BG.t += dt;
  c.clearRect(0,0,cv.width,cv.height);
  // редкая сетка
  c.strokeStyle = 'rgba(0,229,255,0.045)'; c.lineWidth = 1;
  const step = 64, off = (BG.t*8)%step;
  for (let x=-off; x<cv.width; x+=step){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,cv.height); c.stroke(); }
  for (let y=-off; y<cv.height; y+=step){ c.beginPath(); c.moveTo(0,y); c.lineTo(cv.width,y); c.stroke(); }
  for (const p of BG.pts){
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.y < -10){ p.y = cv.height+10; p.x = rnd(cv.width); }
    if (p.x < -10) p.x = cv.width+10;
    if (p.x > cv.width+10) p.x = -10;
    c.globalAlpha = p.a*(0.7+0.3*Math.sin(BG.t*2+p.x));
    c.fillStyle = p.c;
    c.fillRect(p.x, p.y, p.s, p.s);
  }
  c.globalAlpha = 1;
}

/* ---------- Логотип в меню ---------- */
function drawLogo(time){
  const cv = $('logo'), c = cv.getContext('2d');
  const cx = cv.width/2, cy = cv.height/2;
  c.clearRect(0,0,cv.width,cv.height);
  drawGlow(c, cx, cy, 62, '#00e5ff', 0.55);
  c.save(); c.translate(cx, cy);
  c.strokeStyle = '#00e5ff'; c.lineWidth = 2.5;
  for (let i=0;i<3;i++){
    c.save(); c.rotate(time*(0.5+i*0.22)+i*2.1);
    c.beginPath();
    for (let k=0;k<6;k++){
      const a = k*TAU/6, r = 34+i*17;
      k ? c.lineTo(Math.cos(a)*r, Math.sin(a)*r) : c.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.stroke();
    c.restore();
  }
  c.restore();
  const pulse = 1 + Math.sin(time*3)*0.1;
  c.fillStyle = '#9ef7ff';
  c.beginPath(); c.arc(cx, cy, 13*pulse, 0, TAU); c.fill();
}

function cellFromEvent(ev){
  const rect = boardCv.getBoundingClientRect();
  const x = ev.clientX - rect.left - V.ox;
  const y = ev.clientY - rect.top - V.oy;
  return [Math.floor(x/V.cs), Math.floor(y/V.cs)];
}

function initInput(){
  const wrap = $('boardwrap');

  // Наведение — для призрака установки (мышь) и курсора над башней
  boardCv.addEventListener('pointermove', (ev)=>{
    if (!G.active) return;
    G.hoverCell = cellFromEvent(ev);
    if (ev.pointerType === 'mouse'){
      const overTower = !G.placing && G.hoverCell && towerAt(G.hoverCell[0], G.hoverCell[1]);
      boardCv.style.cursor = G.placing ? 'crosshair' : (overTower ? 'pointer' : 'default');
    }
  });
  boardCv.addEventListener('pointerleave', ()=>{
    G.hoverCell = null;
    boardCv.style.cursor = 'default';
  });

  // Клик/тап по полю: способность, установка башни или выбор существующей
  boardCv.addEventListener('pointerdown', (ev)=>{
    AudioSys.resume();
    if (!G.active || G.state !== 'play') return;
    ev.preventDefault();
    const [c, r] = cellFromEvent(ev);
    G.hoverCell = [c, r];
    // ЭМИ-импульс: клик = каст в точку
    if (G.targeting === 'emp'){
      castEmp(c, r);
      boardCv.style.cursor = 'default';
      return;
    }
    if (G.placing){
      const def = TOWERS[G.placing];
      if (canPlace(c, r) && G.cash >= def.cost){
        placeTower(G.placing, c, r);
        if (G.cash < def.cost) G.placing = null;
        UI.syncBuildbar();
      } else {
        AudioSys.play('error');
      }
      return;
    }
    const tw = towerAt(c, r);
    G.selected = tw;
    UI.insKey = '';
    UI.renderInspector();
    AudioSys.play('click');
  });

  // Правая кнопка / долгий тап — отмена установки
  boardCv.addEventListener('contextmenu', (ev)=>{
    ev.preventDefault();
    if (G.placing){ G.placing = null; UI.syncBuildbar(); }

  UI.els.btnWave.addEventListener('click', ()=>{ AudioSys.resume(); startWave(); });

  // Экранные кнопки
  $('btn-play').addEventListener('click', ()=>{ AudioSys.resume(); AudioSys.play('click'); UI.showScreen('maps'); });
  $('btn-lab').addEventListener('click', ()=>{ AudioSys.play('click'); UI.showScreen('lab'); });
  $('btn-ach').addEventListener('click', ()=>{ AudioSys.play('click'); UI.showScreen('ach'); });
  $('btn-settings').addEventListener('click', ()=>{ AudioSys.play('click'); UI.openSettings(); });
  $('maps-back').addEventListener('click', ()=>{ AudioSys.play('click'); UI.showScreen('menu'); });
  $('lab-back').addEventListener('click', ()=>{ AudioSys.play('click'); UI.showScreen('menu'); });
  $('ach-back').addEventListener('click', ()=>{ AudioSys.play('click'); UI.showScreen('menu'); });

  // Клавиатура
  window.addEventListener('keydown', (ev)=>{
    if (ev.repeat) return;
    const k = ev.key;
    if (k === 'Escape'){
      if (!UI.els.overlay.hidden){ UI.closeModal(); if (G.state === 'paused') G.state = 'play'; return; }
      if (G.placing){ G.placing = null; UI.syncBuildbar(); return; }
      if (G.selected){ G.selected = null; UI.renderInspector(); return; }
      return;
    }
    if (UI.cur !== 'game') return;
    if (k === ' '){
      ev.preventDefault();
      if (G.waveState === 'prep' && G.state === 'play') startWave();
      else if (G.state === 'play') UI.openPause();
      return;
    }
    if (k === 'f' || k === 'F' || k === 'а' || k === 'А'){ G.speed = G.speed === 1 ? 2 : 1; return; }
    if (k === 'q' || k === 'Q' || k === 'й' || k === 'Й'){
      G.targeting = G.targeting === 'emp' ? null : 'emp';
      G.placing = null; UI.syncBuildbar();
      return;
    }
    if (k === 'e' || k === 'E' || k === 'у' || k === 'У'){ activateOver(); return; }
    if (k === 'r' || k === 'R' || k === 'к' || k === 'К'){ S.auto = !S.auto; persist(); return; }
    if (G.state !== 'play') return;
    // цифры — выбор башни
    const n = parseInt(k, 10);
    if (n >= 1 && n <= 9){
      const cards = UI.els.buildbar.querySelectorAll('.tcard');
      const card = cards[n-1];
      if (card){ card.click(); }
      return;
    }
    if ((k === 'u' || k === 'U' || k === 'г' || k === 'Г') && G.selected) upgradeTower(G.selected);
    if ((k === 'x' || k === 'X' || k === 'ч' || k === 'Ч') && G.selected) sellTower(G.selected);
  });

  // Клик по оверлею вне модалки — закрыть (кроме паузы)
  UI.els.overlay.addEventListener('pointerdown', (ev)=>{
    if (ev.target === UI.els.overlay && G.state !== 'paused') UI.closeModal();
  });

  // Ресайз канвы
  const ro = new ResizeObserver(()=>computeView());
  ro.observe($('boardwrap'));
  window.addEventListener('resize', ()=>computeView());

  // Разблокировка звука и автопауза
  window.addEventListener('pointerdown', ()=>AudioSys.resume(), { passive:true });
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden && G.state === 'play' && UI.cur === 'game') UI.openPause();
  });
  window.addEventListener('beforeunload', ()=>persist());
}
/* ==================== Точка входа: загрузка, главный цикл ====================
   Цикл на трёх источниках, приоритет сверху вниз:
   1. requestAnimationFrame — стандартный путь в обычном браузере.
   2. Web Worker-тикер — встроенные вебвью, где хост не «кормит» rAF
      (у воркера свой таймер, не подчиняющийся троттлингу страницы).
   3. setInterval — последний рубеж, если Worker недоступен. */

let lastFrame = performance.now();
let acc = 0;
const STEP = 1/60;
let rafQueued = false;
let lastRafAt = 0;     // когда rAF в последний раз дал кадр
let workerOn = false;  // воркер взял цикл на себя
const bootAt = performance.now();
let fpsT0 = performance.now(), fpsN = 0, autoLowDone = false;

function tick(now){
  window.__nc_frames = (window.__nc_frames||0) + 1;
  let dt = (now - lastFrame)/1000;
  lastFrame = now;
  if (dt > 0.1) dt = 0.1; // после сворачивания вкладки не догоняем скачок
  const menuTime = now/1000;

  drawBgfx(dt);
  if (UI.cur === 'menu') drawLogo(menuTime);

  if (G.active){
    // фиксированный шаг логики; скорость ×2 — два шага за кадр
    acc += dt*G.speed;
    let iter = 0;
    while (acc >= STEP && iter < 8){ updateGame(STEP); acc -= STEP; iter++; }
    if (iter === 8) acc = 0;
    // на паузе поле статично — не перерисовываем (экономим батарею и композитинг)
    if (G.state !== 'paused'){
      renderGame();
      UI.updateHUD(false);
      if (G.waveState === 'running') UI.refreshWaveUI();
    }
  }

  // авто-низкая графика: если кадры просели ниже 25 — смягчаем картинку сами
  fpsN++;
  const nowF = performance.now();
  if (nowF - fpsT0 >= 4000){
    const fps = fpsN*1000/(nowF - fpsT0);
    fpsT0 = nowF; fpsN = 0;
    if (!autoLowDone && !S.lowgfx && fps < 25 && nowF - bootAt > 8000){
      autoLowDone = true;
      S.lowgfx = true; persist(); computeView();
      try{ UI.toast(t('s_autolow'), 'warn'); }catch(e){}
    }
  }
}

function rafTick(now){
  rafQueued = false;
  lastRafAt = now;
  workerOn = false; // rAF ожил — воркер больше не нужен
  queueFrame();     // следующий кадр планируем ДО отрисовки: сбой не убьёт цикл
  try{ tick(now); }catch(e){ reportErr(e); }
}
function queueFrame(){
  if (!rafQueued){ rafQueued = true; requestAnimationFrame(rafTick); }
}

/* Любая ошибка не должна останавливать игру: пишем в консоль и показываем один тост */
let lastErrToast = 0;
function reportErr(e){
  console.error('[NEON CORE]', e);
  (window.__errs = window.__errs || []).push(String(e && e.message || e));
  const now = performance.now();
  if (now - lastErrToast > 5000){
    lastErrToast = now;
    try{ UI.toast('Ошибка: ' + (e && e.message || e), 'warn'); }catch(e2){}
  }
}

/* Web Worker-тикер: включается, когда rAF молчит дольше 250мс */
try{
  const workerSrc = 'setInterval(function(){ postMessage(0); }, 16);';
  const w = new Worker(URL.createObjectURL(new Blob([workerSrc], { type:'text/javascript' })));
  w.onmessage = () => {
    const now = performance.now();
    if (!workerOn){
      if (now - Math.max(lastRafAt, bootAt - 300) < 250) return; // rAF жив — не мешаем
      workerOn = true;
    }
    try{ tick(now); }catch(e){ reportErr(e); }
  };
}catch(e){ /* нет Worker — останется интервал */ }

/* Последний рубеж: если ни rAF, ни Worker не работают */
setInterval(()=>{
  if (workerOn) return;
  const now = performance.now();
  if (now - Math.max(lastRafAt, bootAt - 300) < 250) return;
  try{ tick(now); }catch(e){ reportErr(e); }
}, 50);

async function boot(){
  initTelegram();                 // SDK Telegram (в обычном браузере — no-op)
  S = loadSaveFrom(SAVE_KEY);     // ключ мог смениться на пользовательский (по ID игрока)
  try{ await loadCloudSave(); }catch(e){}  // облачный сейв новее локального — берём его
  LANG = S.lang || ((navigator.language||'').toLowerCase().startsWith('ru') ? 'ru' : 'en');
  document.documentElement.lang = LANG;
  applyStaticI18n();
  UI.init();
  initInput();
  initBgfx();
  UI.showScreen('menu');
  syncBackButton();
  queueFrame();
}

boot();

/* ==================== Служебные хуки для отладки (в UI не выставляются) ==================== */
window.__ND = {
  G: ()=>G, S: ()=>S,
  frames: ()=>window.__nc_frames||0,
  cash(n){ G.cash = n; },
  cores(n){ S.cores = n; persist(); },
  wave(){ startWave(); },
  win(){ if (G.active) victory(); },
  lose(){ if (G.active) defeat(); },
  give(type, c, r){ placeTower(type, c, r); },
  star(n){ // начислить звёзды для теста открытий
    mapSave(0).stars = Math.max(mapSave(0).stars, n); persist();
  },
  // прогнать логику вперёд на sec игровых секунд (для автотестов)
  step(sec){
    const n = Math.min(3600, Math.round(sec/STEP));
    for (let i=0;i<n;i++) updateGame(STEP);
    renderGame(); UI.updateHUD(true); UI.refreshWaveUI();
    return { wave:G.wave, state:G.waveState, cash:G.cash, lives:G.lives, enemies:G.enemiesCount };
  },
};
</script>
