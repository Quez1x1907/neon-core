<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>NEON CORE — tower defense</title>
<!-- Официальный SDK Telegram Mini Apps: если страница открыта вне Telegram, объект просто не используется -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ NEON CORE — стили ============ */
:root{
  --bg:#05070f; --bg2:#0a1024;
  --panel:rgba(13,20,40,.88); --panel2:rgba(7,11,24,.92);
  --line:rgba(0,229,255,.22); --line2:rgba(0,229,255,.55);
  --cyan:#00e5ff; --pink:#ff2d78; --lime:#a8ff3e; --amber:#ffb020;
  --violet:#9d5cff; --red:#ff3355; --ice:#4dc3ff;
  --text:#d9f4ff; --dim:#6f8aa8;
  --mono:'Consolas','Cascadia Mono','JetBrains Mono','Courier New',monospace;
  --sans:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-weight:600}

/* ---------- фоновая канва меню ---------- */
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

/* ---------- экраны ---------- */
.screen{position:fixed;inset:0;z-index:2;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- верхняя панель списков ---------- */
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:var(--panel2);z-index:3;
}
.topbar h2{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.6)}
.topbar .chip{margin-left:auto}

/* ---------- кнопки ---------- */
.btn{
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text);background:linear-gradient(180deg,rgba(0,229,255,.14),rgba(0,229,255,.04));
  border:1px solid var(--line2);border-radius:10px;padding:10px 16px;
  transition:box-shadow .15s,transform .05s,background .15s;
}
.btn:hover{box-shadow:0 0 18px rgba(0,229,255,.35);background:linear-gradient(180deg,rgba(0,229,255,.22),rgba(0,229,255,.08))}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:var(--cyan);color:#eaffff;box-shadow:0 0 14px rgba(0,229,255,.25)}
.btn.primary:hover{box-shadow:0 0 26px rgba(0,229,255,.55)}
.btn.danger{border-color:rgba(255,51,85,.6);background:linear-gradient(180deg,rgba(255,51,85,.16),rgba(255,51,85,.05))}
.btn.danger:hover{box-shadow:0 0 18px rgba(255,51,85,.45)}
.btn.ghost{border-color:rgba(111,138,168,.4);background:rgba(10,16,34,.5)}
.btn.big{padding:14px 22px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn.back{padding:8px 14px;font-size:16px}

/* ---------- чипы ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-family:var(--mono);font-size:13px;white-space:nowrap;
}
.chip.cores{color:var(--lime);border-color:rgba(168,255,62,.4);text-shadow:0 0 10px rgba(168,255,62,.5)}

/* ---------- панели ---------- */
/* без backdrop-filter: панели висят над канвой, которая перерисовывается каждый кадр —
   блюр подложки заставил бы пересчитываться на каждом кадре и ронял FPS */
.panel{
  background:rgba(13,20,40,.93);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 0 24px rgba(0,229,255,.07),inset 0 0 44px rgba(0,229,255,.03);
}

/* ---------- меню ---------- */
#screen-menu{align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px}
#logo{filter:drop-shadow(0 0 18px rgba(0,229,255,.35))}
.title{
  font-family:var(--mono);font-size:clamp(40px,9vw,68px);letter-spacing:.16em;
  color:#eaffff;text-shadow:0 0 8px rgba(0,229,255,.9),0 0 34px rgba(0,229,255,.45);
  margin-top:6px;line-height:1;
}
.title span{color:var(--pink);text-shadow:0 0 8px rgba(255,45,120,.9),0 0 34px rgba(255,45,120,.5)}
.tagline{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase;margin:10px 0 26px}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,84vw)}
.menu-stats{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.menu-stats b{color:var(--lime);font-weight:600}

/* ---------- списки (карты / лаба / ачивки) ---------- */
.scroll-list{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin}
.scroll-list::-webkit-scrollbar{width:8px}
.scroll-list::-webkit-scrollbar-thumb{background:rgba(0,229,255,.25);border-radius:4px}

/* карты */
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:1100px;margin:0 auto;width:100%}
.map-card{position:relative;padding:12px;cursor:pointer;transition:box-shadow .15s,transform .1s}
.map-card:hover{box-shadow:0 0 26px rgba(0,229,255,.28)}
.map-card canvas{width:100%;height:96px;display:block;border-radius:8px;background:rgba(3,6,14,.8);border:1px solid rgba(0,229,255,.12)}
.map-card .mc-name{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:13px;margin:10px 2px 4px;display:flex;justify-content:space-between;gap:6px}
.map-card .mc-name em{font-style:normal;color:var(--dim);font-size:11px}
.map-card .mc-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.map-card.locked{opacity:.55;cursor:default}
.map-card.locked:hover{box-shadow:none}
.mc-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(4,7,16,.72);border-radius:14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--dim)}
.mc-lock b{color:var(--amber);font-size:16px}
.stars{display:flex;gap:3px}
.stars svg{width:17px;height:17px;fill:rgba(111,138,168,.35)}
.stars svg.on{fill:var(--amber);filter:drop-shadow(0 0 5px rgba(255,176,32,.8))}

/* лаборатория */
.lab-list{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;width:100%}
.track{display:flex;gap:14px;padding:14px;align-items:center}
.track .t-icon{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:rgba(0,229,255,.05)}
.track .t-icon svg{width:26px;height:26px;fill:none;stroke:var(--cyan);stroke-width:1.6}
.track .t-main{flex:1;min-width:0}
.track .t-name{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.track .t-desc{font-size:12px;color:var(--dim);margin-top:3px}
.track .t-desc b{color:var(--lime);font-weight:600}
.pips{display:flex;gap:4px;margin-top:7px}
.pips i{width:22px;height:6px;border-radius:3px;background:rgba(111,138,168,.25)}
.pips i.on{background:var(--lime);box-shadow:0 0 8px rgba(168,255,62,.6)}
.track .t-buy{display:flex;flex-direction:column;align-items:center;gap:5px}
.track .t-buy .btn{padding:8px 14px;font-size:12px}

/* достижения */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1000px;margin:0 auto;width:100%}
.ach-card{padding:13px 14px}
.ach-card .a-name{font-family:var(--mono);font-size:13px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.ach-card .a-name .rw{color:var(--lime);font-size:12px;white-space:nowrap}
.ach-card .a-desc{font-size:12px;color:var(--dim);margin-top:5px}
.ach-card .a-bar{height:5px;border-radius:3px;background:rgba(111,138,168,.2);margin-top:9px;overflow:hidden}
.ach-card .a-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:3px}
.ach-card.unlocked{border-color:rgba(168,255,62,.45);box-shadow:0 0 18px rgba(168,255,62,.12)}
.ach-card.unlocked .a-name{color:var(--lime)}

/* ---------- игровой экран ---------- */
#screen-game.active{display:grid;grid-template-rows:auto 1fr auto}
#hud{
  display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;
  padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--panel2);border-bottom:1px solid var(--line);z-index:6;
}
.hud-spacer{flex:1;min-width:8px}
#hud .chip{padding:5px 11px;font-size:13px}
#hud .chip.money{color:var(--lime);border-color:rgba(168,255,62,.35)}
#hud .chip.lives{color:#ff9db8;border-color:rgba(255,45,120,.4)}
#hud .chip.lives.low{color:var(--red);border-color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.hbtn{
  width:38px;height:34px;border-radius:9px;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(0,229,255,.12),rgba(0,229,255,.03));
  font-family:var(--mono);font-size:13px;color:var(--text);display:flex;align-items:center;justify-content:center;
}
.hbtn:hover{box-shadow:0 0 14px rgba(0,229,255,.4)}
.hbtn svg{width:17px;height:17px;fill:var(--text)}
.hbtn b{font-family:var(--mono);font-size:14px;color:var(--text)}
.hbtn .cdt{position:absolute;bottom:1px;right:3px;font-family:var(--mono);font-size:9px;color:var(--amber)}
.hbtn{position:relative}
.hbtn.cd{opacity:.4}
.hbtn.ab{border-color:rgba(125,249,255,.5)}
.hbtn.arm{border-color:#7df9ff;box-shadow:0 0 16px rgba(125,249,255,.7);color:#7df9ff}
.hbtn.act{border-color:var(--amber);box-shadow:0 0 16px rgba(255,176,32,.8)}
.hbtn.on{border-color:var(--lime);color:var(--lime);box-shadow:0 0 12px rgba(168,255,62,.4)}
.pv.mod{font-family:var(--mono);letter-spacing:.04em;cursor:help}

#boardwrap{position:relative;min-height:0;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* кнопка волны + превью */
#nextwave{
  position:absolute;right:10px;bottom:10px;z-index:5;display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:12px;
}
#btn-wave{padding:10px 16px;font-size:13px}
#wave-preview{display:flex;gap:7px;flex-wrap:wrap;max-width:220px}
.pv{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(3,6,14,.6);border:1px solid rgba(111,138,168,.25);border-radius:6px;padding:3px 6px}
.pv i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;display:inline-block;box-shadow:0 0 6px currentColor}
.pv.boss i{width:13px;height:13px;border-radius:3px}

/* инспектор башни */
#inspector{position:absolute;left:10px;bottom:10px;z-index:5;width:min(300px,calc(100% - 20px));padding:12px 14px;display:none}
#inspector.open{display:block}
#inspector .i-head{display:flex;align-items:center;gap:8px}
#inspector .i-head img{width:34px;height:34px}
#inspector .i-name{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#inspector .i-lvl{display:flex;gap:3px;margin-top:4px}
#inspector .i-lvl i{width:16px;height:5px;border-radius:2px;background:rgba(111,138,168,.3)}
#inspector .i-lvl i.on{background:var(--cyan);box-shadow:0 0 6px rgba(0,229,255,.7)}
#inspector .i-close{margin-left:auto;font-size:15px;color:var(--dim);padding:2px 8px}
#inspector .i-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:10px 0;font-family:var(--mono);font-size:12px}
#inspector .i-stats span{color:var(--dim)}
#inspector .i-stats b{font-weight:600;color:var(--text);text-align:right}
#inspector .i-btns{display:flex;gap:8px;flex-wrap:wrap}
#inspector .i-btns .btn{padding:8px 12px;font-size:11px;flex:1;min-width:70px}
#inspector .i-next{font-family:var(--mono);font-size:11px;color:var(--lime);margin-bottom:8px}
#inspector .i-diff{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-family:var(--mono);font-size:11.5px}
#inspector .i-drow{display:flex;align-items:center;gap:6px}
#inspector .i-drow span{color:var(--dim);flex:1}
#inspector .i-drow b{font-weight:600;color:var(--text)}
#inspector .i-drow em{font-style:normal;color:var(--dim)}
@media (max-width:560px){
  body.ins-open #nextwave{display:none}
}

/* баннер волны */
#wavebanner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:7}
.banner-text{
  font-family:var(--mono);font-size:clamp(26px,6vw,44px);letter-spacing:.3em;text-transform:uppercase;
  color:#eaffff;text-shadow:0 0 14px rgba(0,229,255,.9),0 0 44px rgba(0,229,255,.5);
  opacity:0;
}
.banner-text.pink{text-shadow:0 0 14px rgba(255,45,120,.95),0 0 44px rgba(255,45,120,.55);color:#ffe6f0}
.banner-text.show{animation:bannerIn 2.2s ease forwards}
.banner-sub{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--amber);text-shadow:0 0 12px rgba(255,176,32,.8);margin-top:10px;opacity:0}
.banner-sub.show{animation:bannerIn 2.6s ease forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:scale(.85);letter-spacing:.55em}
  18%{opacity:1;transform:scale(1)}
  78%{opacity:1}
  100%{opacity:0;transform:scale(1.04)}
}

/* подсказка */
.hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
  padding:9px 16px;border-radius:999px;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  color:var(--amber);border-color:rgba(255,176,32,.5);
  box-shadow:0 0 22px rgba(255,176,32,.18);animation:hintPulse 1.6s ease-in-out infinite;max-width:88%;text-align:center;
}
@keyframes hintPulse{50%{box-shadow:0 0 34px rgba(255,176,32,.4)}}

/* полоса босса */
#bossbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;width:min(420px,72%);display:none;flex-direction:column;gap:4px;padding:8px 12px;border-radius:10px}
#bossbar.show{display:flex}
#bossbar .b-name{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--pink);text-align:center;text-shadow:0 0 10px rgba(255,45,120,.8)}
#bossbar .b-track{height:8px;border-radius:4px;background:rgba(255,45,120,.15);overflow:hidden;border:1px solid rgba(255,45,120,.4)}
#bossbar .b-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff2d78,#ff7a2d);box-shadow:0 0 12px rgba(255,45,120,.8);transition:width .15s linear}

/* панель строительства */
#buildbar{
  display:flex;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  overflow-x:auto;background:var(--panel2);border-top:1px solid var(--line);z-index:6;scrollbar-width:none;
}
#buildbar::-webkit-scrollbar{display:none}
.tcard{
  flex:none;width:76px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:box-shadow .12s,border-color .12s,opacity .12s;position:relative;
}
.tcard img{width:40px;height:40px;pointer-events:none}
.tcard .tc-cost{font-family:var(--mono);font-size:12px;color:var(--lime)}
.tcard .tc-key{position:absolute;top:3px;left:6px;font-family:var(--mono);font-size:9px;color:var(--dim)}
.tcard:hover{box-shadow:0 0 16px rgba(0,229,255,.3)}
.tcard.sel{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,229,255,.5);background:rgba(0,229,255,.08)}
.tcard.off{opacity:.38}
.tcard.off .tc-cost{color:var(--red)}

/* ---------- модальные окна ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.72);backdrop-filter:blur(5px)}
.overlay[hidden]{display:none}
.modal{width:min(430px,92vw);max-height:86vh;overflow-y:auto;padding:22px 22px 20px;scrollbar-width:thin}
.modal h3{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;font-size:16px;text-align:center;margin-bottom:16px;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.6)}
.modal h3.pink{color:var(--pink);text-shadow:0 0 14px rgba(255,45,120,.7)}
.modal h3.lime{color:var(--lime);text-shadow:0 0 14px rgba(168,255,62,.6)}
.modal .m-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.modal .m-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-family:var(--mono);font-size:13px}
.modal .m-row span{color:var(--dim)}
.modal .m-text{font-size:13px;color:var(--dim);text-align:center;line-height:1.5}
.save-ta{
  width:100%;height:72px;resize:none;margin-top:10px;
  background:rgba(3,6,14,.8);border:1px solid var(--line);border-radius:8px;
  color:var(--dim);font-family:var(--mono);font-size:10px;padding:8px;
  -webkit-user-select:text;user-select:text;
}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:7px 14px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.seg button.on{background:rgba(0,229,255,.18);color:var(--text)}
.v-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.v-stars svg{width:44px;height:44px;fill:rgba(111,138,168,.3);opacity:0;transform:scale(.3)}
.v-stars svg.on{fill:var(--amber);filter:drop-shadow(0 0 10px rgba(255,176,32,.9))}
.v-stars svg.pop{animation:starPop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes starPop{to{opacity:1;transform:scale(1)}}
.v-reward{text-align:center;font-family:var(--mono);color:var(--lime);font-size:14px;margin-bottom:6px;text-shadow:0 0 12px rgba(168,255,62,.5)}
.v-sub{text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:8px}
.v-weapons{display:flex;flex-direction:column;gap:6px;margin:0 4px 8px}
.v-weapon{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px}
.v-weapon span{width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-weapon i{flex:1;height:7px;border-radius:4px;background:rgba(111,138,168,.2);overflow:hidden}
.v-weapon i b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:4px}
.v-weapon em{font-style:normal;width:34px;text-align:right;color:var(--dim)}

/* ---------- тултип башни ---------- */
.tt{
  position:fixed;z-index:40;width:250px;padding:11px 13px;pointer-events:none;
  background:rgba(7,11,24,.96);
  box-shadow:0 0 26px rgba(0,229,255,.16);
}
.tt .tt-name{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tt .tt-desc{font-size:11.5px;color:var(--dim);margin:4px 0 8px}
.tt .tt-rows{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-family:var(--mono);font-size:11.5px}
.tt .tt-rows span{color:var(--dim)}
.tt .tt-rows b{font-weight:600;text-align:right}
.tt .tt-foot{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--lime)}
.tt .tt-key{color:var(--dim)}

/* ---------- тосты ---------- */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 16px;
  font-family:var(--mono);font-size:12.5px;box-shadow:0 0 22px rgba(0,229,255,.2);
  animation:toastIn .3s ease;max-width:100%;text-align:center;
}
.toast.ach{border-color:rgba(168,255,62,.55);color:var(--lime);box-shadow:0 0 22px rgba(168,255,62,.25)}
.toast.warn{border-color:rgba(255,176,32,.55);color:var(--amber)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.toast.out{opacity:0;transition:opacity .4s}

/* ---------- адаптив ---------- */
@media (orientation:landscape) and (min-width:900px){
  #inspector{left:auto;right:10px;top:64px;bottom:auto}
}
/* ---------- телефон в портрете ---------- */
@media (max-width:560px){
  /* HUD: крупные тач-цели, перенос на вторую строку при нехватке места */
  #hud{gap:6px;padding:6px 8px}
  #hud .chip{font-size:12px;padding:6px 10px}
  .hbtn{width:40px;height:38px}
  .hbtn b{font-size:15px}

  /* кнопка волны — полноширинная панель, превью под ней скроллится */
  #nextwave{left:6px;right:6px;bottom:6px;flex-wrap:wrap;gap:6px;padding:8px;border-radius:12px}
  #btn-wave{flex:1 1 100%;font-size:14px;padding:12px 16px}
  #wave-preview{flex:1 1 100%;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;max-width:none;padding:2px;scrollbar-width:none}
  #wave-preview::-webkit-scrollbar{display:none}
  .pv{flex:none}

  /* инспектор — шторка снизу над панелью строительства */
  #inspector{left:6px;right:6px;width:auto;top:auto;bottom:6px;max-height:44%;overflow-y:auto;border-radius:12px}

  /* подсказка — под HUD */
  .hint{top:calc(6px + env(safe-area-inset-top));bottom:auto;left:8px;right:8px;transform:none;max-width:none}

  /* панель строительства: крупные карточки */
  .tcard{width:72px;padding:8px 4px 7px}
  .tcard img{width:40px;height:40px}
  .tcard .tc-cost{font-size:13px}
  #buildbar{gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}

  .map-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .banner-text{font-size:22px}
  .modal{width:min(430px,94vw)}
}
/* ---------- телефон боком: ужимаем панели, чтобы всё влезло по высоте ---------- */
@media (max-height:460px) and (orientation:landscape){
  #hud{padding:4px 8px;gap:6px}
  #hud .chip{padding:3px 8px;font-size:11.5px}
  .hbtn{width:34px;height:30px}
  .hbtn b{font-size:12px}
  .tcard{width:58px;padding:4px 3px}
  .tcard img{width:28px;height:28px}
  .tcard .tc-cost{font-size:11px}
  #buildbar{padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
  #nextwave{padding:5px 8px;bottom:4px;right:4px}
  #btn-wave{padding:7px 12px;font-size:12px}
  #wave-preview{display:none}
  #inspector{width:260px;max-height:70%}
  .hint{bottom:8px}
}
</style>

<body>
<canvas id="bgfx"></canvas>

<!-- ГЛАВНОЕ МЕНЮ -->
<section id="screen-menu" class="screen">
  <canvas id="logo" width="200" height="200"></canvas>
  <h1 class="title">NEON<span>CORE</span></h1>
  <div class="tagline" data-i="tagline"></div>
  <div class="menu-btns">
    <button class="btn primary big" id="btn-play" data-i="play"></button>
    <button class="btn big" id="btn-lab" data-i="lab"></button>
    <button class="btn big" id="btn-ach" data-i="ach"></button>
    <button class="btn ghost big" id="btn-settings" data-i="settings"></button>
  </div>
  <div class="menu-stats" id="menu-stats"></div>
</section>

<!-- ВЫБОР КАРТЫ -->
<section id="screen-maps" class="screen">
  <header class="topbar">
    <button class="btn back" id="maps-back">←</button>
    <h2 data-i="select_map"></h2>
    <div class="chip cores" id="maps-stars"></div>
  </header>
  <div class="scroll-list"><div class="map-grid" id="map-grid"></div></div>
</section>

<!-- ЛАБОРАТОРИЯ (мета-прокачка) -->
<section id="screen-lab" class="screen">
  <header class="topbar">
    <button class="btn back" id="lab-back">←</button>
    <h2 data-i="lab"></h2>
    <div class="chip cores" id="lab-cores"></div>
  </header>
  <div class="scroll-list"><div class="lab-list" id="lab-list"></div></div>
</section>

<!-- ДОСТИЖЕНИЯ -->
<section id="screen-ach" class="screen">
  <header class="topbar">
    <button class="btn back" id="ach-back">←</button>
    <h2 data-i="ach"></h2>
    <div class="chip" id="ach-count"></div>
  </header>
  <div class="scroll-list"><div class="ach-grid" id="ach-grid"></div></div>
</section>

<!-- ИГРА -->
<section id="screen-game" class="screen">
  <div id="hud">
    <div class="chip" id="hud-wave"></div>
    <div class="chip money" id="hud-cash"></div>
    <div class="chip lives" id="hud-lives"></div>
    <div class="hud-spacer"></div>
    <button class="hbtn ab" id="btn-ab-emp" title="Q"></button>
    <button class="hbtn ab" id="btn-ab-over" title="E"></button>
    <button class="hbtn" id="btn-speed" title="F">1×</button>
    <button class="hbtn" id="btn-auto" title="R">A</button>
    <button class="hbtn" id="btn-pause" title="Space"></button>
    <button class="hbtn" id="btn-home" title="Esc"></button>
  </div>
  <div id="boardwrap">
    <canvas id="board"></canvas>
    <div id="bossbar"><div class="b-name" id="boss-name"></div><div class="b-track"><div class="b-fill" id="boss-fill"></div></div></div>
    <div id="inspector" class="panel"></div>
    <div id="nextwave" class="panel">
      <button id="btn-wave" class="btn primary"></button>
      <div id="wave-preview"></div>
    </div>
    <div id="wavebanner"><div class="banner-text" id="banner-text"></div><div class="banner-sub" id="banner-sub"></div></div>
    <div id="hint" class="panel hint" hidden></div>
  </div>
  <div id="buildbar"></div>
</section>

<!-- МОДАЛЬНЫЕ ОКНА И ТОСТЫ -->
<div id="tt" class="panel tt" hidden></div>
<div id="overlay" class="overlay" hidden><div class="modal panel" id="modal"></div></div>

  n = Math.round(n);
  if (n >= 100000) return Math.round(n/1000)+'k';
  if (n >= 10000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return ''+n;
}
function hexA(hex, a){ // '#rrggbb' + alpha → 'rgba(...)'
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function shade(hex, f){ // f>1 светлее, f<1 темнее
  const c = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  return 'rgb('+c.map(v=>clamp(Math.round(v*f),0,255)).join(',')+')';
}

/* ==================== Сохранения (localStorage + мягкая деградация) ====================
   Ключ сейва привязан к пользователю Telegram (SAVE_KEY = neoncore_v1_u<id>),
   чтобы на общем устройстве прогресс игроков не смешивался.
   Вне Telegram — общий ключ neoncore_v1. */
let SAVE_KEY = 'neoncore_v1';
function defSave(){
  return {
    v:1, lang:null, sound:true, lowgfx:false, auto:false, cores:0, savedAt:0,
    meta:{ dmg:0, lives:0, cash:0, income:0 },
    maps:{},            // idx → {stars, best, milestone}
    ach:{},             // id → 1
    seen:{},            // флаги "уже видел" (интро врагов, мутаций)
    tut:{},             // шаги обучения
    stats:{ kills:0, money:0, bosses:0, towersBuilt:0, maxTowers:0, maxTowerLevel:1, bestCleanWave:0, branches:0, maxAmps:0 },
  };
}
const storageOK = (()=>{ try{ localStorage.setItem('__nc_t','1'); localStorage.removeItem('__nc_t'); return true; }catch(e){ return false; } })();
function mergeSave(d, loaded){
  Object.assign(d, loaded);
  d.meta = Object.assign(defSave().meta, loaded.meta||{});
  d.stats = Object.assign(defSave().stats, loaded.stats||{});
  d.maps = loaded.maps||{}; d.ach = loaded.ach||{}; d.seen = loaded.seen||{}; d.tut = loaded.tut||{};
  return d;
}
function loadSaveFrom(key){
  const d = defSave();
  if (storageOK){
    try{
      const raw = localStorage.getItem(key);
      if (raw) mergeSave(d, JSON.parse(raw));
    }catch(e){ /* повреждённый сейв — начинаем с чистого */ }
  }
  return d;
}
let S = loadSaveFrom(SAVE_KEY);
function persist(){
  S.savedAt = Date.now();
  if (storageOK){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
  // зеркалим в облачное хранилище Telegram — прогресс синхронится между устройствами
  try{ if (TG && TG.CloudStorage && typeof TG.CloudStorage.setItem === 'function') TG.CloudStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function resetSave(){ S = defSave(); persist(); }
function mapSave(i){ return S.maps[i] || (S.maps[i] = { stars:0, best:0, milestone:0 }); }
function addCores(n){ S.cores += n; persist(); }
function totalStars(){ let s=0; for(const k in S.maps) s += S.maps[k].stars||0; return s; }
function endlessBest(){ let b=0; for(const k in S.maps) b = Math.max(b, S.maps[k].best||0); return b; }
function unlockedTowerCount(){ return TOWER_ORDER.filter(tp=>totalStars()>=UNLOCK_STARS[tp]).length; }

      this.master = this.ctx.createGain();
      this.master.gain.value = S.sound ? 0.5 : 0;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate*0.6);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ this.init(); if (this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(freq, dur, type, vol, slideTo, delay){
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay||0);
    if (!isFinite(t0) || !isFinite(freq) || freq <= 0) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+0.02);
  },
  noise(dur, vol, f0, f1, delay, type){
    if (!this.ctx || !this.noiseBuf) return;
    const t0 = this.ctx.currentTime + (delay||0);
    if (!isFinite(t0)) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type||'lowpass';
    f.frequency.setValueAtTime(f0||1000, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol||0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0+dur+0.02);
  },
  /* name — событие; троттлинг не даёт одинаковым звукам захлёбываться */
  play(name){
    if (!this.ctx || !S.sound) return;
    const now = this.ctx.currentTime;
    const gaps = { pulse:0.055, tesla:0.09, boom:0.07, beamtick:0.1, click:0.03, coin:0.09, hit:0.05, snipe:0.06 };
    if (gaps[name] !== undefined && this.last[name] !== undefined && now - this.last[name] < gaps[name]) return;
    this.last[name] = now;
    switch(name){
      case 'click':   this.tone(700,0.06,'square',0.08,420); break;
      case 'place':   this.tone(220,0.1,'sine',0.22,560); this.tone(440,0.08,'sine',0.12,880,0.05); break;
      case 'upgrade': this.tone(520,0.08,'square',0.12); this.tone(660,0.08,'square',0.12,undefined,0.07); this.tone(880,0.12,'square',0.12,undefined,0.14); break;
      case 'sell':    this.tone(600,0.14,'sine',0.16,240); break;
      case 'error':   this.tone(160,0.12,'sawtooth',0.14,110); break;
      case 'pulse':   this.tone(880+rnd(-60,60),0.045,'square',0.05,500); break;
      case 'snipe':   this.noise(0.09,0.2,3200,500); this.tone(180,0.08,'sine',0.18,60); break;
      case 'missile': this.noise(0.22,0.12,600,2600,0,'bandpass'); break;
      case 'boom':    this.noise(0.3,0.3,1400,90); this.tone(90,0.25,'sine',0.3,40); break;
      case 'tesla':   this.tone(1400,0.07,'sawtooth',0.09,300); this.noise(0.06,0.1,4000,1500,0,'highpass'); break;
      case 'beamtick':this.tone(1150+rnd(-80,80),0.05,'sawtooth',0.035,1000); break;
      case 'toxin':   this.tone(180+rnd(-30,30),0.07,'sine',0.05,340); break;
      case 'coin':    this.tone(980,0.06,'sine',0.1); this.tone(1320,0.09,'sine',0.1,undefined,0.05); break;
      case 'hit':     this.tone(300,0.04,'triangle',0.06,220); break;
      case 'leak':    this.tone(320,0.16,'square',0.2,180); this.tone(220,0.2,'square',0.2,120,0.12); break;
      case 'heal':    this.tone(600,0.1,'sine',0.05,900); break;
      case 'wavestart': this.tone(330,0.12,'square',0.1,440); this.tone(440,0.14,'square',0.1,660,0.1); break;
      case 'boss':    this.tone(70,0.5,'sawtooth',0.3,55); this.tone(140,0.5,'square',0.14,100,0.05); this.noise(0.5,0.1,300,80); break;
      case 'emp':     this.tone(900,0.25,'sawtooth',0.14,80); this.noise(0.25,0.16,2500,150); break;
      case 'over':    this.tone(280,0.5,'sawtooth',0.16,980); this.tone(560,0.4,'square',0.08,1400,0.08); break;
      case 'nova':    this.tone(50,0.7,'sawtooth',0.3,240); this.noise(0.6,0.28,900,60); this.tone(440,0.3,'sine',0.12,880,0.1); break;
      case 'win':     [523,659,784,1047].forEach((f,i)=>this.tone(f,0.16,'square',0.12,undefined,i*0.11)); break;
      case 'lose':    [392,330,262,196].forEach((f,i)=>this.tone(f,0.22,'sawtooth',0.12,undefined,i*0.16)); break;
      case 'ach':     [784,988,1175,1568].forEach((f,i)=>this.tone(f,0.1,'sine',0.1,undefined,i*0.07)); break;
    }
  },
};
/* ==================== Telegram Mini App: интеграция ====================
   Если страница открыта вне Telegram (обычный браузер, file://), всё ниже —
   безопасные no-op: игра работает как раньше. Внутри Telegram:
   фуллскрин, тёмная тема шапки, запрет свайпа-закрытия, кнопка «Назад»,
   вибро-отклик и облачное сохранение прогресса между устройствами. */

let TG = null;

function initTelegram(){
  try{
    TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  }catch(e){ TG = null; }
  if (!TG) return;
  // сейв по пользователю: ключ привязан к ID игрока Telegram
  try{
    const u = TG.initDataUnsafe && TG.initDataUnsafe.user;
    if (u && u.id){
      SAVE_KEY = 'neoncore_v1_u' + u.id;
      // одноразовая миграция общего сейва в пользовательский ключ
      if (storageOK && !localStorage.getItem(SAVE_KEY)){
        const legacy = localStorage.getItem('neoncore_v1');
        if (legacy){ localStorage.setItem(SAVE_KEY, legacy); localStorage.removeItem('neoncore_v1'); }
      }
    }
  }catch(e){}
  try{ if (typeof TG.ready === 'function') TG.ready(); }catch(e){}
  try{ if (typeof TG.expand === 'function') TG.expand(); }catch(e){}
  try{ if (typeof TG.disableVerticalSwipes === 'function') TG.disableVerticalSwipes(); }catch(e){}
  try{ if (typeof TG.enableClosingConfirmation === 'function') TG.enableClosingConfirmation(); }catch(e){}
  try{ if (typeof TG.setHeaderColor === 'function') TG.setHeaderColor('#05070f'); }catch(e){}
  try{ if (typeof TG.setBackgroundColor === 'function') TG.setBackgroundColor('#05070f'); }catch(e){}
  try{
    if (TG.BackButton && typeof TG.BackButton.onClick === 'function'){
      TG.BackButton.onClick(()=>{
        if (UI.cur === 'maps' || UI.cur === 'lab' || UI.cur === 'ach'){
          AudioSys.play('click');
          UI.showScreen('menu');
        }
      });
    }
  }catch(e){}
  // сворачивание мини-аппа — ставим бой на паузу
  try{
    if (typeof TG.onEvent === 'function'){
      TG.onEvent('deactivated', ()=>{
        try{ if (G.state === 'play' && UI.cur === 'game') UI.openPause(); }catch(e){}
      });
    }
  }catch(e){}
}

/* Кнопка «Назад» Telegram: видна на экранах списков */
function syncBackButton(){
  if (!TG || !TG.BackButton) return;
  const show = UI.cur === 'maps' || UI.cur === 'lab' || UI.cur === 'ach';
  try{ show ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
}

/* Вибро-отклик: 'light' — удар, 'success'/'error'/'warning' — уведомления */
function haptic(kind){
  try{
    const h = TG && TG.HapticFeedback;
    if (!h) return;
    if (kind === 'light' && typeof h.impactOccurred === 'function') h.impactOccurred('light');
    else if (typeof h.notificationOccurred === 'function') h.notificationOccurred(kind);
  }catch(e){}
}

/* Облачный сейв: если в Telegram он новее локального — берём его */
function loadCloudSave(){
  return new Promise((resolve)=>{
    try{
      if (!TG || !TG.CloudStorage || typeof TG.CloudStorage.getItem !== 'function') return resolve();
      TG.CloudStorage.getItem(SAVE_KEY, (err, data)=>{
        try{
          if (!err && data){
            const parsed = JSON.parse(data);
            if (parsed && parsed.v === 1 && (parsed.savedAt||0) > (S.savedAt||0)){
              const d = defSave();
              Object.assign(d, parsed);
              d.meta = Object.assign(defSave().meta, parsed.meta||{});
              d.stats = Object.assign(defSave().stats, parsed.stats||{});
              d.maps = parsed.maps||{}; d.ach = parsed.ach||{}; d.seen = parsed.seen||{}; d.tut = parsed.tut||{};
              S = d;
            }
          }
        }catch(e){}
        resolve();
      });
    }catch(e){ resolve(); }
  });
}
/* ==================== Рендер-помощники: глоу-спрайты, фигуры, иконки ====================
   shadowBlur в горячем цикле не используем — неон делаем предрендерами-спрайтами и composite 'lighter'. */

const glowCache = {};
function glowSprite(color){
  if (glowCache[color]) return glowCache[color];
  const size = 128, r = 56;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(size/2, size/2, 0, size/2, size/2, r);
  g.addColorStop(0, hexA(color, 0.85));
  g.addColorStop(0.35, hexA(color, 0.32));
  g.addColorStop(1, hexA(color, 0));
  c.fillStyle = g; c.fillRect(0,0,size,size);
  glowCache[color] = cv;
  return cv;
}
function drawGlow(ctx, x, y, radius, color, alpha){
  if (alpha === undefined) alpha = 1;
  if (alpha <= 0.01) return;
  const sp = glowSprite(color), s = radius*2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(sp, x-s, y-s, s*2, s*2);
  ctx.restore();
}

function rr(ctx,x,y,w,h,r){ // скруглённый прямоугольник
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* Зигзаг молнии между двумя точками */
function zapPath(ctx, x1,y1, x2,y2, amp){
  ctx.beginPath(); ctx.moveTo(x1,y1);
  const segs = 6;
  for (let i=1;i<segs;i++){
    const k = i/segs;
    const nx = lerp(x1,x2,k) + rnd(-amp,amp);
    const ny = lerp(y1,y2,k) + rnd(-amp,amp);
    ctx.lineTo(nx,ny);
  }
  ctx.lineTo(x2,y2);
}

/* ---- Фигуры врагов: полупрозрачная заливка + обводка + внутренние детали.
   time — игровое время, seed — уникальный сдвиг врага (анимация «вразнобой»). ---- */
function drawEnemyShape(ctx, shape, cx, cy, R, ang, color, lw, time, seed){
  ctx.save();
  ctx.translate(cx, cy);
  const t = (time||0) + (seed||0)*1.7;
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const fill = ()=>{ ctx.fillStyle = hexA(color, 0.16); ctx.fill(); ctx.stroke(); };
  const dot = (r)=>{ ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = color; ctx.fill(); };
  ctx.beginPath();
  switch(shape){
    case 'tri': // дрон: стрелка с ядром
      ctx.moveTo(Math.cos(ang)*R, Math.sin(ang)*R);
      ctx.lineTo(Math.cos(ang+2.5)*R, Math.sin(ang+2.5)*R);
      ctx.lineTo(Math.cos(ang-2.5)*R, Math.sin(ang-2.5)*R);
      ctx.closePath(); fill();
      ctx.save(); ctx.rotate(ang); dot(R*0.22); ctx.restore();
      break;
    case 'dia': // бит: вращающийся ромбик
      ctx.rotate(t*2.4);
      ctx.moveTo(0,-R); ctx.lineTo(R,0); ctx.lineTo(0,R); ctx.lineTo(-R,0);
      ctx.closePath(); fill();
      break;
    case 'dart': // спринтер: острый дротик со шлейфом скорости
      ctx.moveTo(Math.cos(ang)*R*1.3, Math.sin(ang)*R*1.3);
      ctx.lineTo(Math.cos(ang+2.3)*R, Math.sin(ang+2.3)*R);
      ctx.lineTo(Math.cos(ang)*R*0.25, Math.sin(ang)*R*0.25);
      ctx.lineTo(Math.cos(ang-2.3)*R, Math.sin(ang-2.3)*R);
      ctx.closePath(); fill();
      ctx.save(); ctx.rotate(ang);
      ctx.globalAlpha *= 0.55;
      ctx.beginPath();
      ctx.moveTo(-R*1.1, -R*0.3); ctx.lineTo(-R*(1.6+0.25*Math.sin(t*9)), -R*0.3);
      ctx.moveTo(-R*1.1,  R*0.3); ctx.lineTo(-R*(1.6+0.25*Math.cos(t*9)), R*0.3);
      ctx.stroke(); ctx.restore();
      break;
    case 'hex': // броневик: шестигранник с пластинами
      for (let i=0;i<6;i++){ const a=ang+i*TAU/6; i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R); }
      ctx.closePath(); fill();
      ctx.save(); ctx.rotate(-ang*0.7 + t*0.2);
      ctx.beginPath();
      for (let i=0;i<6;i++){ const a=i*TAU/6; i?ctx.lineTo(Math.cos(a)*R*0.55,Math.sin(a)*R*0.55):ctx.moveTo(Math.cos(a)*R*0.55,Math.sin(a)*R*0.55); }
      ctx.closePath(); ctx.stroke();
      ctx.beginPath();
      for (let i=0;i<3;i++){ const a=i*TAU/3; ctx.moveTo(Math.cos(a)*R*0.55, Math.sin(a)*R*0.55); ctx.lineTo(Math.cos(a)*R*0.95, Math.sin(a)*R*0.95); }
      ctx.stroke(); ctx.restore();
      break;
    case 'plus': { // медик: крест с пульсирующим ореолом лечения
      const p = R*0.38;
      ctx.moveTo(-R,-p); ctx.lineTo(-p,-p); ctx.lineTo(-p,-R); ctx.lineTo(p,-R); ctx.lineTo(p,-p);
      ctx.lineTo(R,-p); ctx.lineTo(R,p); ctx.lineTo(p,p); ctx.lineTo(p,R); ctx.lineTo(-p,R);
      ctx.lineTo(-p,p); ctx.lineTo(-R,p);
      ctx.closePath(); fill();
      ctx.globalAlpha *= 0.5;
      ctx.beginPath(); ctx.arc(0, 0, R*(1.25+0.18*Math.sin(t*4)), 0, TAU); ctx.stroke();
      break;
    }
    case 'blob': // фантом: капля с «хвостами», дрожит
      ctx.save(); ctx.rotate(Math.sin(t*5)*0.15);
      ctx.arc(0, 0, R*0.85, 0, TAU);
      ctx.moveTo(R*0.5,-R*0.5); ctx.lineTo(R*0.95,-R*0.95);
      ctx.moveTo(-R*0.5,-R*0.5); ctx.lineTo(-R*0.95,-R*0.95);
      ctx.moveTo(-R*0.85,0); ctx.lineTo(-R*1.2, -R*0.35); ctx.moveTo(-R*0.85,0); ctx.lineTo(-R*1.2, R*0.35);
      fill();
      ctx.restore();
      break;
    case 'shield': { // эгида: ядро-квадрат + вращающаяся дуга щита
      ctx.rect(-R*0.6,-R*0.6,R*1.2,R*1.2); fill();
      dot(R*0.18);
      const a0 = t*2;
      ctx.beginPath(); ctx.arc(0, 0, R*1.35, a0, a0+TAU*0.6); ctx.stroke();
      break;
    }
    case 'split': { // делитель: клетка с двумя ядрами, готова разделиться
      ctx.save(); ctx.rotate(Math.sin(t*4)*0.12);
      ctx.beginPath(); ctx.arc(0, 0, R*0.85, 0, TAU); fill();
      ctx.beginPath(); ctx.moveTo(0, -R*0.85); ctx.lineTo(0, R*0.85); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(-R*0.32, 0, R*0.2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(R*0.32, 0, R*0.2, 0, TAU); ctx.fill();
      ctx.restore();
      break;
    }
    case 'boss': { // босс: два встречно вращающихся шестигранника + орбита
      ctx.save(); ctx.rotate(t*0.35);
      for (let i=0;i<6;i++){ const a=i*TAU/6; i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R); }
      ctx.closePath(); fill();
      ctx.restore();
      ctx.save(); ctx.rotate(-t*0.6);
      ctx.beginPath();
      for (let i=0;i<6;i++){ const a=i*TAU/6; i?ctx.lineTo(Math.cos(a)*R*0.5,Math.sin(a)*R*0.5):ctx.moveTo(Math.cos(a)*R*0.5,Math.sin(a)*R*0.5); }
      ctx.closePath(); ctx.stroke();
      ctx.restore();
      dot(R*0.16);
      for (let i=0;i<3;i++){
        const a = t*1.5 + i*TAU/3;
        ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.85, Math.sin(a)*R*0.85, R*0.1, 0, TAU);
        ctx.fillStyle = color; ctx.fill();
      }
      break;
    }
  }
  ctx.restore();
}

/* ---- Башни: восьмиугольная платформа + глиф типа + пипсы уровня ---- */
function drawTowerAt(ctx, type, lvl, px, py, cs, aim, color){
  const R = cs*0.36;
  // платформа
  ctx.save(); ctx.translate(px,py);
  ctx.beginPath();
  for (let i=0;i<8;i++){ const a=i*TAU/8+TAU/16; i?ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R):ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R); }
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,14,30,.9)'; ctx.fill();
  ctx.strokeStyle = hexA(color,0.55); ctx.lineWidth = Math.max(1,cs*0.045); ctx.stroke();
  // глиф
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.2, cs*0.055); ctx.lineCap = 'round';
  const g = R*0.55;
  ctx.beginPath();
  switch(TOWERS[type].kind){
    case 'gun':
      ctx.save(); ctx.rotate(aim||0);
      ctx.moveTo(-g*0.5,0); ctx.lineTo(g,0); ctx.moveTo(-g*0.5,-g*0.45); ctx.lineTo(-g*0.5,g*0.45);
      ctx.stroke(); ctx.restore(); break;
    case 'cryo':
      for (let i=0;i<3;i++){ const a=i*TAU/3+(aim||0); ctx.moveTo(Math.cos(a)*g*0.3,Math.sin(a)*g*0.3); ctx.lineTo(Math.cos(a)*g,Math.sin(a)*g); }
      ctx.stroke(); break;
    case 'missile':
      ctx.save(); ctx.rotate(aim||0);
      ctx.moveTo(-g*0.4,-g*0.5); ctx.lineTo(g*0.8,0); ctx.lineTo(-g*0.4,g*0.5); ctx.closePath(); ctx.stroke();
      ctx.restore(); break;
    case 'tesla':
      ctx.moveTo(-g,0); ctx.lineTo(-g*0.2,0); ctx.lineTo(-g*0.35,-g*0.5); ctx.lineTo(g*0.4,g*0.05);
      ctx.lineTo(g*0.25,-g*0.45); ctx.lineTo(g,0.01);
      ctx.stroke(); break;
    case 'sniper':
      ctx.save(); ctx.rotate(aim||0);
      ctx.moveTo(-g*0.6,0); ctx.lineTo(g,0);
      ctx.moveTo(g*0.15,-g*0.35); ctx.lineTo(g*0.15,g*0.35);
      ctx.stroke(); ctx.restore(); break;
    case 'bank':
      ctx.moveTo(-g,g*0.7); ctx.lineTo(-g,-g*0.4); ctx.lineTo(0,-g); ctx.lineTo(g,-g*0.4); ctx.lineTo(g,g*0.7);
      ctx.moveTo(-g*0.45,g*0.7); ctx.lineTo(-g*0.45,-g*0.1); ctx.moveTo(0,g*0.7); ctx.lineTo(0,-g*0.1); ctx.moveTo(g*0.45,g*0.7); ctx.lineTo(g*0.45,-g*0.1);
      ctx.stroke(); break;
    case 'beam':
      ctx.save(); ctx.rotate(aim||0);
      ctx.rect(-g*0.7,-g*0.4,g*0.9,g*0.8); ctx.stroke();
      ctx.moveTo(g*0.2,0); ctx.lineTo(g,0); ctx.stroke();
      ctx.restore(); break;
    case 'poison': // колба с пузырьками
      ctx.beginPath(); ctx.arc(0, g*0.35, g*0.55, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.28, g*0.35-g*0.5); ctx.lineTo(g*0.28, g*0.35-g*0.5);
      ctx.moveTo(-g*0.22, g*0.35-g*0.5); ctx.lineTo(-g*0.22, g*0.35-g*0.15);
      ctx.moveTo(g*0.22, g*0.35-g*0.5); ctx.lineTo(g*0.22, g*0.35-g*0.15);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(-g*0.12, g*0.42, g*0.12, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(g*0.16, g*0.55, g*0.08, 0, TAU); ctx.stroke();
      break;
    case 'amp': // излучатель: концентрические дуги
      ctx.beginPath(); ctx.arc(-g*0.35, 0, g*0.4, -TAU/4, TAU/4); ctx.stroke();
      ctx.beginPath(); ctx.arc(-g*0.35, 0, g*0.85, -TAU/4, TAU/4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-g*0.7, 0); ctx.lineTo(g*0.1, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(g*0.1, 0, g*0.16, 0, TAU); ctx.stroke();
      break;
  }
  // пипсы уровня
  ctx.restore();
  if (lvl > 1){
    ctx.fillStyle = color;
    for (let i=0;i<lvl;i++) ctx.fillRect(px-cs*0.16+i*cs*0.16, py+R+cs*0.06, cs*0.1, cs*0.05);
  }
}

/* Иконки для DOM-карточек (data URL, рисуются один раз) */
